<title>Say It Out Loud</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one centered column; a flashcard stage up top, deck grid below. Palette follows the repo's infographic cards (navy header, blue accent). */
:root {
  --bg: #f4f6fb; --surface: #ffffff; --line: #d8deea; --ink: #1b2540; --muted: #5b6578;
  --navy: #1b2540; --navy-ink: #e6ebf7; --accent: #2457d6; --accent-soft: #e7eeff;
  --good: #138a43; --good-soft: #e3f4ea; --warn: #b45309; --warn-soft: #fdf0e1; --bad: #c62828; --bad-soft: #fde8e8;
  --display: "IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif;
  --body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", Consolas, ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1424; --surface: #18203a; --line: #2a3556; --ink: #e6ebf7; --muted: #9aa5bb;
  --navy: #0a0e1b; --navy-ink: #e6ebf7; --accent: #7aa2ff; --accent-soft: #1f2c52;
  --good: #4cc27e; --good-soft: #15301f; --warn: #f0a24a; --warn-soft: #3a2a14; --bad: #ff7a7a; --bad-soft: #3d1a1d;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0f1424; --surface: #18203a; --line: #2a3556; --ink: #e6ebf7; --muted: #9aa5bb;
  --navy: #0a0e1b; --navy-ink: #e6ebf7; --accent: #7aa2ff; --accent-soft: #1f2c52;
  --good: #4cc27e; --good-soft: #15301f; --warn: #f0a24a; --warn-soft: #3a2a14; --bad: #ff7a7a; --bad-soft: #3d1a1d;
  color-scheme: dark }
* { box-sizing: border-box }
body { background: var(--bg); color: var(--ink); font: 15px/1.55 var(--body); }
.band { background: var(--navy); color: var(--navy-ink); }
.wrap { max-width: 860px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header .wrap { padding-block: 22px 18px; display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: end; justify-content: space-between; }
h1 { font: 700 30px/1.1 var(--display); margin: 0; letter-spacing: .2px; text-wrap: balance; }
.tag { margin: 4px 0 0; color: #b9c4dc; font-size: 13.5px; }
.stats { display: flex; gap: 18px; font-variant-numeric: tabular-nums; }
.stat b { display: block; font: 700 24px/1 var(--display); }
.stat span { font-size: 11.5px; letter-spacing: .6px; text-transform: uppercase; color: #b9c4dc; }
main .wrap { padding-block: 20px 40px; display: grid; gap: 22px; }
.note { font-size: 13px; color: var(--muted); margin: 0; }
.note.warn { color: var(--warn); }

/* controls */
.controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: none; color: var(--ink); font: 500 13px var(--body); padding: 7px 12px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--accent); color: #fff; }
.seg button + button { border-left: 1px solid var(--line); }
.chk { display: inline-flex; gap: 6px; align-items: center; font-size: 13.5px; color: var(--muted); cursor: pointer; }
.chk input { accent-color: var(--accent); width: 16px; height: 16px; }
.filterline { font-size: 13px; color: var(--muted); }
.filterline button { border: 0; background: none; color: var(--accent); font: inherit; cursor: pointer; padding: 0; text-decoration: underline; }

/* card stage */
.stage { background: var(--surface); border: 1.5px solid var(--line); border-radius: 14px; padding: 22px 24px; display: grid; gap: 14px; min-height: 280px; align-content: start; }
.stage:focus { outline: none; }
.meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 12.5px; color: var(--muted); }
.pill { font: 600 11.5px var(--body); letter-spacing: .5px; text-transform: uppercase; padding: 3px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); }
.pill.miss { background: var(--bad-soft); color: var(--bad); }
.pill.box { background: var(--good-soft); color: var(--good); }
.progress { margin-left: auto; font-variant-numeric: tabular-nums; }
.q { font: 600 21px/1.35 var(--body); margin: 0; text-wrap: pretty; }
.hint { font-size: 13px; color: var(--muted); margin: 0; }
.a { border-top: 1px dashed var(--line); padding-top: 14px; font-size: 16px; line-height: 1.6; margin: 0; white-space: pre-line; }
code { font: 14px var(--mono); background: var(--accent-soft); padding: 1px 5px; border-radius: 4px; }
.ref { font: 12.5px var(--mono); color: var(--muted); margin: 0; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; }
.btn { font: 600 14.5px var(--body); border-radius: 10px; padding: 11px 18px; cursor: pointer; border: 1.5px solid transparent; display: inline-flex; gap: 8px; align-items: center; }
.btn kbd { font: 11px var(--mono); opacity: .75; border: 1px solid currentColor; border-radius: 4px; padding: 0 4px; }
.btn.primary { background: var(--accent); color: #fff; }
.btn.miss { background: var(--bad-soft); color: var(--bad); border-color: var(--bad); }
.btn.shaky { background: var(--warn-soft); color: var(--warn); border-color: var(--warn); }
.btn.got { background: var(--good-soft); color: var(--good); border-color: var(--good); }
.btn:focus-visible, .seg button:focus-visible, .deck:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.done h2 { font: 700 24px var(--display); margin: 0; }
.tally { display: flex; gap: 18px; font-variant-numeric: tabular-nums; flex-wrap: wrap; }
.tally span b { font: 700 22px var(--display); margin-right: 4px; }

/* deck grid */
.decks h2 { font: 700 18px var(--display); margin: 0 0 10px; letter-spacing: .3px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
.deck { text-align: left; background: var(--surface); border: 1.5px solid var(--line); border-radius: 10px; padding: 10px 12px; cursor: pointer; color: var(--ink); font: inherit; display: grid; gap: 6px; }
.deck[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.deck .name { font-weight: 600; font-size: 14px; }
.deck .nums { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.bar { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; display: flex; }
.bar i { display: block; height: 100% }
.bar .m { background: var(--good) } .bar .s { background: var(--accent); opacity: .55 }
.legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); margin-top: 8px; flex-wrap: wrap; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
@media (max-width: 520px) { .q { font-size: 18.5px } .stage { padding: 18px 16px } h1 { font-size: 26px } }
@media (prefers-reduced-motion: no-preference) { .a { animation: rise .18s ease-out } @keyframes rise { from { opacity: .4; transform: translateY(4px) } } }
</style>

<header class="band"><div class="wrap">
  <div><h1>Say It Out Loud</h1><p class="tag">Answer aloud first, then flip. Be honest with the grade.</p></div>
  <div class="stats" aria-live="polite">
    <div class="stat"><b id="s-due">0</b><span>due now</span></div>
    <div class="stat"><b id="s-new">0</b><span>never seen</span></div>
    <div class="stat"><b id="s-mast">0</b><span>mastered</span></div>
  </div>
</div></header>

<main><div class="wrap">
  <div class="controls">
    <div class="seg" role="group" aria-label="Cards per round">
      <button type="button" data-size="10">10</button><button type="button" data-size="20" aria-pressed="true">20</button><button type="button" data-size="40">40</button>
    </div>
    <label class="chk"><input type="checkbox" id="only-miss"> Interview misses only</label>
    <button type="button" class="btn primary" id="start">Start round</button>
  </div>
  <p class="filterline" id="filterline"></p>

  <section class="stage" id="stage" aria-live="polite" tabindex="-1"></section>
  <p class="note" id="sync"></p>

  <section class="decks">
    <h2>Decks</h2>
    <div class="grid" id="grid"></div>
    <div class="legend"><span><i style="background:var(--good)"></i>mastered (box 4+)</span><span><i style="background:var(--accent);opacity:.55"></i>seen</span><span>Tap decks to filter a round.</span></div>
  </section>
</div></main>

<script>
const DECK = [{"id": "data-model-1", "deck": "data-model", "title": "Python Data Model", "source": "card", "q": "What does `b = a` do to a list, and what is the difference between copy.copy and copy.deepcopy on `[[1, 2], [3]]`?", "a": "Assignment never copies; b is just another name for the same object. copy.copy makes a new outer list but shares the inner lists. deepcopy copies all the way down, so mutating the copy's inner list leaves the original alone.", "ref": "cards/python_data_model"}, {"id": "data-model-2", "deck": "data-model", "title": "Python Data Model", "source": "card", "q": "When do you use `is` versus `==`? And why is `256 is 256` True but you should never rely on it?", "a": "`==` asks __eq__ (value equality); `is` asks identity, same object. Use `is` only for None and sentinels. 256 is True because CPython caches small ints from -5 to 256, an implementation detail.", "ref": "cards/python_data_model"}, {"id": "data-model-3", "deck": "data-model", "title": "Python Data Model", "source": "card", "q": "State the __eq__/__hash__ contract. What breaks if you hash on a mutable field and then mutate the object?", "a": "If a == b then hash(a) == hash(b), not the reverse. Hash on a mutable field, mutate after inserting into a set, and the object sits in the wrong bucket: `p in s` is False and d[p] raises KeyError. Use frozen dataclasses.", "ref": "cards/python_data_model"}, {"id": "data-model-4", "deck": "data-model", "title": "Python Data Model", "source": "card", "q": "You define __eq__ on a class and nothing else. What happens when you put instances in a set, and why?", "a": "TypeError: unhashable type. Defining __eq__ without __hash__ makes Python set __hash__ to None. Fix by defining __hash__ on the same fields, or use @dataclass(frozen=True), which generates both consistently.", "ref": "cards/python_data_model"}, {"id": "data-model-5", "deck": "data-model", "title": "Python Data Model", "source": "card", "q": "Why does `def add(x, acc=[])` bite you, and what is the fix?", "a": "Default values are evaluated once, at def time, so the same list is shared by every call and keeps growing. Fix: default to None and create the list inside, `acc = [] if acc is None else acc`.", "ref": "cards/python_data_model"}, {"id": "data-model-6", "deck": "data-model", "title": "Python Data Model", "source": "card", "q": "What does `[f() for f in [lambda: i for i in range(3)]]` return, and how do you fix it?", "a": "[2, 2, 2]. The closure looks up `i` when called, not when created (late binding), and the loop has finished. Fix by binding at creation: `lambda i=i: i`.", "ref": "cards/python_data_model"}, {"id": "data-model-7", "deck": "data-model", "title": "Python Data Model", "source": "card", "q": "How do you write a decorator that takes arguments, and why do you use functools.wraps?", "a": "Three layers: the outer takes the config, the middle takes the function, the inner is the wrapper taking *args, **kwargs. wraps keeps the original name and docstring so debugging, introspection and frameworks like FastAPI still work.", "ref": "cards/python_data_model"}, {"id": "memory-gil-1", "deck": "memory-gil", "title": "Python Memory, Copies & GIL", "source": "card", "q": "How does CPython free memory? Why do you need a cycle collector if refcounting exists?", "a": "Refcounting frees an object the instant its count hits zero, deterministically. Two objects pointing at each other keep each other at 1, so only the generational cycle GC can free them. Break cycles with weakref. `del x` removes one name, not the object.", "ref": "cards/python_memory_gil"}, {"id": "memory-gil-2", "deck": "memory-gil", "title": "Python Memory, Copies & GIL", "source": "card", "q": "A teammate says `counter += 1` is safe because of the GIL. Are they right?", "a": "No. The GIL protects CPython internals, not your logic. `counter += 1` is several bytecodes (load, add, store), and a thread switch between load and store loses an update. Use a threading.Lock, a Queue, or a single owner thread.", "ref": "cards/python_memory_gil"}, {"id": "memory-gil-3", "deck": "memory-gil", "title": "Python Memory, Copies & GIL", "source": "card", "q": "Why can a service copy a default config per request and still leak state between requests?", "a": "A shallow copy (copy.copy, dict(x), lst[:]) shares nested objects, so mutating a nested key changes the shared default and leaks into every later request. Fix: deepcopy it or rebuild the structure per request.", "ref": "cards/python_memory_gil"}, {"id": "memory-gil-4", "deck": "memory-gil", "title": "Python Memory, Copies & GIL", "source": "card", "q": "Where does the interpreter switch threads, and what is the 5 ms thing?", "a": "A running thread is asked to drop the GIL roughly every 5 ms (sys.getswitchinterval() is 0.005), and it also drops it voluntarily on blocking I/O, time.sleep, and C code that opts in. Switches can land between bytecodes, which is where your logic can interleave.", "ref": "cards/python_memory_gil"}, {"id": "memory-gil-5", "deck": "memory-gil", "title": "Python Memory, Copies & GIL", "source": "card", "q": "What is the status of free-threaded Python, and would you adopt it today?", "a": "3.13t was experimental; 3.14t is officially supported (PEP 779) with roughly 5-10% single-thread cost. A C extension not marked free-thread-safe turns the GIL back on at import. For I/O-bound FastAPI, asyncio already wins, so not today.", "ref": "cards/python_memory_gil"}, {"id": "memory-gil-6", "deck": "memory-gil", "title": "Python Memory, Copies & GIL", "source": "card", "q": "You have CPU-bound pure Python on four cores. Threads or something else, and why?", "a": "Processes (multiprocessing or ProcessPoolExecutor), because threads serialize on the GIL for pure-Python bytecode. Threads only help if the work is blocking I/O or inside C code that releases the GIL, like NumPy or hashlib on big buffers.", "ref": "cards/python_memory_gil"}, {"id": "async-1", "deck": "async", "title": "Async & Concurrency", "source": "card", "q": "A workload mixes I/O waits, sync-only libraries, and CPU-heavy work. How do you pick between asyncio, to_thread and processes?", "a": "Many I/O waits with async libs: asyncio. I/O but only a sync library: asyncio.to_thread, since the GIL is freed on I/O. CPU-heavy pure Python: processes. Long or heavy work: a separate worker behind a queue.", "ref": "W03_async"}, {"id": "async-2", "deck": "async", "title": "Async & Concurrency", "source": "card", "q": "Explain 'one thread, switching only at await'. What goes wrong if a handler calls time.sleep or does CPU work?", "a": "Tasks are concurrent, not parallel: the loop switches only at an await. time.sleep or CPU work with no await blocks the loop, so every request waits. Symptoms: p99 spikes on unrelated endpoints and failed health checks, not necessarily high CPU.", "ref": "W03_async"}, {"id": "async-3", "deck": "async", "title": "Async & Concurrency", "source": "card", "q": "What actually happens when you call task.cancel(), and what must you do with CancelledError?", "a": "cancel() is only a request: a CancelledError is raised at the task's next await. Do bounded cleanup in finally and re-raise; never swallow it. It's a BaseException since 3.8, so `except Exception` won't catch it by accident.", "ref": "W03_async"}, {"id": "async-4", "deck": "async", "title": "Async & Concurrency", "source": "card", "q": "Why can an unreferenced asyncio.create_task() disappear mid-flight, and what is the fix?", "a": "The event loop keeps only a weak reference to tasks, so a fire-and-forget task can be garbage collected. Keep a strong reference: store it in a set and add_done_callback(set.discard), or give it an owner like a TaskGroup.", "ref": "W03_async"}, {"id": "async-5", "deck": "async", "title": "Async & Concurrency", "source": "card", "q": "The loop is single-threaded. So why do you still need asyncio.Lock for `if k not in cache: cache[k] = await fetch(k)`?", "a": "Two tasks can both pass the check before either finishes the await, causing a double fetch. Single-threaded is not race-free across an await. Use a Lock for single-flight. These primitives are per-process only; across pods use Redis or a real queue.", "ref": "W03_async"}, {"id": "async-6", "deck": "async", "title": "Async & Concurrency", "source": "card", "q": "How do you bound concurrency in an async fan-out to an external API?", "a": "Semaphore(n) sized to the API limit or DB pool, usually with a TaskGroup, and a semaphore per host. Use Queue(maxsize) for backpressure so put() waits when full. Unbounded fan-out or buffers just move the failure.", "ref": "W03_async"}, {"id": "async-7", "deck": "async", "title": "Async & Concurrency", "source": "card", "q": "What is the preferred way to put a deadline on an await, and how do you pass a request's budget downstream?", "a": "asyncio.timeout(5) as a context manager, which raises TimeoutError; wait_for is the older equivalent. Use timeout_at(deadline) to share a request's absolute budget downstream. shield() survives an outer cancel; use sparingly.", "ref": "W03_async"}, {"id": "redis-1", "deck": "redis", "title": "Caching with Redis", "source": "card", "q": "Name the four caching patterns and say which you default to and why.", "a": "Cache-aside (default): app misses, reads the DB, SETs with a TTL; on write, update the DB then DEL the key. Read-through, write-through (sync to both, slower writes) and write-behind (async flush, a crash loses acked writes) are the others. DB is truth.", "ref": "cards/redis_caching"}, {"id": "redis-2", "deck": "redis", "title": "Caching with Redis", "source": "card", "q": "On a write, why do you update the DB and DEL the cache key instead of SET-ing the new value?", "a": "Two writers A and B can race so the DB ends with B but the cache gets A last, leaving a stale value until TTL. DEL lets the next read refill from the DB. Every key still needs a TTL as the backstop.", "ref": "cards/redis_caching"}, {"id": "redis-3", "deck": "redis", "title": "Caching with Redis", "source": "card", "q": "DEL-on-write still has one race. Describe it.", "a": "A reader misses and reads the old row from the DB; the writer then updates the DB and DELs the key; the reader finally SETs the old row, so the cache is stale. The TTL is the backstop, optionally with a delayed second DEL.", "ref": "cards/redis_caching"}, {"id": "redis-4", "deck": "redis", "title": "Caching with Redis", "source": "card", "q": "A hot key expires and 1,000 requests miss at once. What is this and how do you prevent it?", "a": "A cache stampede (thundering herd) hitting the DB. Options: a single-flight lock (SET rebuild:k NX PX) so one rebuilds while others wait or serve stale; probabilistic early refresh (XFetch); TTL jitter; stale-while-revalidate.", "ref": "cards/redis_caching"}, {"id": "redis-5", "deck": "redis", "title": "Caching with Redis", "source": "card", "q": "Which maxmemory-policy do you pick for a pure cache vs skewed traffic, and what is the default trap?", "a": "allkeys-lru for a pure cache, allkeys-lfu when hot and cold keys are skewed. The default noeviction makes writes fail with OOM when full, fine for a store but wrong for a cache. volatile-* only evicts keys with a TTL, so with no TTLs it behaves like noeviction.", "ref": "cards/redis_caching"}, {"id": "redis-6", "deck": "redis", "title": "Caching with Redis", "source": "card", "q": "Why is a plain DEL a wrong lock release, and what does a fencing token add?", "a": "DEL can free someone else's lock after yours expired, so release by compare-and-delete in Lua against your unique token. Fencing adds a rising number per grant that storage checks, because a GC pause longer than the TTL can still produce two holders.", "ref": "cards/redis_caching"}, {"id": "resilience-1", "deck": "resilience", "title": "Resilience Patterns", "source": "card", "q": "What timeouts should every outbound call have, and what is the trap with Python's requests library?", "a": "Connect (100-500 ms), read/total (about p99.9 of the call, from data), and pool-acquire (tens of ms). requests has no default timeout, so a hung socket pins a worker forever; httpx defaults to 5 s. Always pass one explicitly.", "ref": "cards/resilience_patterns"}, {"id": "resilience-2", "deck": "resilience", "title": "Resilience Patterns", "source": "card", "q": "How do you propagate a deadline across hops, and what goes wrong with an inner timeout of 5 s under an outer 300 ms?", "a": "Pass an absolute deadline (grpc-timeout or a header); each hop uses min(own timeout, remaining minus margin) and fails fast if remaining is less than the expected work. A 5 s inner timeout means the callee keeps working for a client that already gave up.", "ref": "cards/resilience_patterns"}, {"id": "resilience-3", "deck": "resilience", "title": "Resilience Patterns", "source": "card", "q": "What does a good retry policy look like, and what is retry amplification?", "a": "Exponential backoff with full jitter, uniform(0, min(cap, base*2^n)), capped attempts and total time, only on connect errors, 502/503/504 and 429. Three retries at each of three layers means 27x load on the DB. Retry at one layer with a retry budget around 10%.", "ref": "cards/resilience_patterns"}, {"id": "resilience-4", "deck": "resilience", "title": "Resilience Patterns", "source": "card", "q": "When must you NOT retry, and what's careful about timeouts?", "a": "Don't retry 400/401/403/404/409/422, or a POST without an idempotency key. A timeout is ambiguous: the call may have succeeded, so retry only idempotent operations. Without jitter, all clients retry in lockstep and create synchronized waves.", "ref": "cards/resilience_patterns"}, {"id": "resilience-5", "deck": "resilience", "title": "Resilience Patterns", "source": "card", "q": "Walk me through a circuit breaker and its common mistakes.", "a": "Closed, then open when the error rate is high over a minimum volume (say 50% over 20 calls in 10 s), then half-open after a cooldown to probe. Open means fail fast with a cheap fallback. Traps: no minimum volume, one global breaker instead of per dependency, retrying while open.", "ref": "cards/resilience_patterns"}, {"id": "resilience-6", "deck": "resilience", "title": "Resilience Patterns", "source": "card", "q": "Design idempotency-key handling for a payment POST.", "a": "Client sends the same Idempotency-Key on every retry. Server atomically inserts (key, request_hash, in_progress) with a unique constraint, then stores the response. Same hash done: replay it; in progress: 409; different body: 422. Strongest: key row in the same DB transaction as the effect.", "ref": "cards/resilience_patterns"}, {"id": "resilience-7", "deck": "resilience", "title": "Resilience Patterns", "source": "card", "q": "What are bulkheads and load shedding, and what is a metastable failure?", "a": "A bulkhead is a separate pool or semaphore per dependency so one slow service can't eat every worker; size it with Little's law. Shed early with 503 + Retry-After and drop requests past their deadline. An unbounded queue causes metastable failure: every request times out and it stays stuck after load drops.", "ref": "cards/resilience_patterns"}, {"id": "docker-1", "deck": "docker", "title": "Docker: Image & Runtime", "source": "card", "q": "Why a multi-stage build for a Python service, and what must match between stages?", "a": "Compilers, headers, uv and caches stay in the build stage and only the venv ships, giving a smaller, safer image. The base image and venv path must be the same in both stages, or the venv's python symlink breaks.", "ref": "cards/docker_image_runtime"}, {"id": "docker-2", "deck": "docker", "title": "Docker: Image & Runtime", "source": "card", "q": "How do you order Dockerfile layers, and why doesn't `rm` in a later layer shrink the image?", "a": "Cache is top-down, so order least to most churn: base, OS packages, lockfile and deps, then source. A changed layer rebuilds everything after it. A later rm only hides files; layers are immutable, so clean up in the same RUN.", "ref": "cards/docker_image_runtime"}, {"id": "docker-3", "deck": "docker", "title": "Docker: Image & Runtime", "source": "card", "q": "slim, alpine or distroless for a Python service?", "a": "slim is the default (about 130 MB, glibc wheels just install). alpine uses musl, so glibc wheels don't fit and it compiles from source, often bigger and slower. Distroless is tiny with no shell, so debug via kubectl debug ephemeral containers.", "ref": "cards/docker_image_runtime"}, {"id": "docker-4", "deck": "docker", "title": "Docker: Image & Runtime", "source": "card", "q": "Why exec-form CMD, and what is special about PID 1?", "a": "Shell form makes /bin/sh PID 1, which doesn't forward SIGTERM, so no drain and a SIGKILL at grace. Exec form makes the app PID 1. PID 1 gets no default signal actions and must reap zombies; use tini or --init, and end shell entrypoints with `exec \"$@\"`.", "ref": "cards/docker_image_runtime"}, {"id": "docker-5", "deck": "docker", "title": "Docker: Image & Runtime", "source": "card", "q": "A secret is passed via ARG or COPY'd during the build and deleted later. Is it safe?", "a": "No. ARG, ENV and copied files live in layer history and `docker history` shows them; deleting later doesn't help. Use RUN --mount=type=secret at build time, and inject runtime secrets via K8s Secrets or a Key Vault CSI driver.", "ref": "cards/docker_image_runtime"}, {"id": "docker-6", "deck": "docker", "title": "Docker: Image & Runtime", "source": "card", "q": "What does container runtime hardening look like for a Python API?", "a": "Run non-root (USER 10001 plus runAsNonRoot), readOnlyRootFilesystem with an emptyDir for /tmp, drop all capabilities and block privilege escalation. Supply chain: pin base images by digest, scan with Trivy, tag with the git SHA.", "ref": "cards/docker_image_runtime"}, {"id": "auth-1", "deck": "auth", "title": "Auth: Sessions, JWT, OAuth2 & OIDC", "source": "card", "q": "Session cookie vs JWT: how do they differ on revocation and scale, and what's the trap?", "a": "A session is server state: delete the row and revocation is instant, but each request needs a lookup. A JWT is self-contained, verified by any pod with a public key, but lives until exp. The trap: a jti denylist puts state back; the win is no lookup, not no state.", "ref": "cards/auth_oauth_jwt"}, {"id": "auth-2", "deck": "auth", "title": "Auth: Sessions, JWT, OAuth2 & OIDC", "source": "card", "q": "What are the main risks of storing a JWT, and where should it live?", "a": "In localStorage any XSS can read it, so keep it in memory or an HttpOnly cookie (then you need CSRF protection via SameSite plus a token). The payload is base64, not encrypted, so no secrets or PII in claims.", "ref": "cards/auth_oauth_jwt"}, {"id": "auth-3", "deck": "auth", "title": "Auth: Sessions, JWT, OAuth2 & OIDC", "source": "card", "q": "What is the aud claim on an access token vs an ID token, and who reads each?", "a": "Access token: aud is the resource API, read only by the API (it may be opaque to the client). ID token: always a JWT with aud equal to the client_id, read only by the client. Never send an ID token to an API as a bearer.", "ref": "cards/auth_oauth_jwt"}, {"id": "auth-4", "deck": "auth", "title": "Auth: Sessions, JWT, OAuth2 & OIDC", "source": "card", "q": "Walk through authorization code + PKCE and say why PKCE matters.", "a": "Client makes a random verifier and sends challenge = BASE64URL(SHA256(verifier)) with a state; user logs in; client gets a code and POSTs it with the verifier; the IdP checks the hash. A code stolen from the redirect is useless without the verifier. Public clients can't hold a secret, so PKCE is their proof.", "ref": "cards/auth_oauth_jwt"}, {"id": "auth-5", "deck": "auth", "title": "Auth: Sessions, JWT, OAuth2 & OIDC", "source": "card", "q": "Access vs refresh tokens: lifetimes, where each is sent, and what is refresh rotation?", "a": "Access: short (5-15 min), sent on every API call. Refresh: days to weeks, sent only to the IdP /token endpoint. With rotation each refresh returns a new refresh token and kills the old one; reuse of an old one signals theft, so revoke the whole family.", "ref": "cards/auth_oauth_jwt"}, {"id": "auth-6", "deck": "auth", "title": "Auth: Sessions, JWT, OAuth2 & OIDC", "source": "card", "q": "How do you validate a JWT correctly?", "a": "Pin the algorithms (e.g. RS256) and ignore the header's alg to block alg=none and RS256-to-HS256 confusion. Fetch the key from the IdP's JWKS by kid, cached with rotation handling. Check exp, nbf with small skew, iss, aud, then scope.", "ref": "cards/auth_oauth_jwt"}, {"id": "api-1", "deck": "api", "title": "API Design", "source": "card", "q": "Which HTTP methods are safe and which are idempotent, and what does idempotent not mean?", "a": "GET is safe and idempotent; PUT and DELETE are idempotent but not safe; POST is neither, so retries need a key. PATCH is idempotent only for merge-patch. Idempotent means the same end state after N calls, not the same response: the second DELETE returns 404.", "ref": "cards/api_design"}, {"id": "api-2", "deck": "api", "title": "API Design", "source": "card", "q": "400 vs 422, and 401 vs 403?", "a": "400 is malformed (bad JSON); 422 parses but the values are invalid (FastAPI's default). 401 is really 'not authenticated'; 403 is 'known but not allowed'. Also 409 for state conflicts and duplicate creates.", "ref": "cards/api_design"}, {"id": "api-3", "deck": "api", "title": "API Design", "source": "card", "q": "Why is offset pagination a problem at depth, and how does cursor pagination work?", "a": "OFFSET 100000 reads 100,020 rows to keep 20, and rows arriving mid-paging cause skips and duplicates. A cursor is an opaque token of (created_at, id): WHERE (created_at, id) < (:ts, :id) ORDER BY ... LIMIT 21 seeks the index at flat cost. Cost: no jump-to-page-N.", "ref": "cards/api_design"}, {"id": "api-4", "deck": "api", "title": "API Design", "source": "card", "q": "Compare token bucket, sliding window and fixed window rate limiting. What do you return when you reject?", "a": "Token bucket allows bursts up to b at average r/s with two numbers of state. Fixed window allows 2x burst at the window edge; sliding counter is approximate but smooth. Reject with 429 plus Retry-After and RateLimit headers; key by API key or tenant, not just IP.", "ref": "cards/api_design"}, {"id": "api-5", "deck": "api", "title": "API Design", "source": "card", "q": "How do you prevent lost updates in a REST API?", "a": "ETag plus If-Match. GET returns an ETag; PUT sends If-Match with it. Match: apply and return a new ETag. Stale: 412 Precondition Failed, and the client re-GETs, merges and retries. Under the hood: UPDATE ... WHERE id=7 AND version=12; zero rows means 412. Missing header: 428.", "ref": "cards/api_design"}, {"id": "api-6", "deck": "api", "title": "API Design", "source": "card", "q": "How do you version and evolve an API, and what is an additive change?", "a": "Default to /v1 in the URL: visible and cacheable. Additive (new optional field or endpoint) is safe; removing, renaming, retyping or adding a required field is breaking and needs a new version. Clients use a tolerant reader; retire with Deprecation and Sunset headers while tracking usage.", "ref": "cards/api_design"}, {"id": "api-7", "deck": "api", "title": "API Design", "source": "card", "q": "REST, gRPC, GraphQL, webhooks/SSE: when do you pick each?", "a": "REST + JSON for public and partner CRUD, cacheable. gRPC for internal service-to-service and streaming (HTTP/2 pins L4 balancing). GraphQL for many client shapes (watch N+1, use DataLoader, add cost limits). Webhooks/SSE for long jobs and LLM token streams; webhooks are at-least-once, so dedupe and sign.", "ref": "cards/api_design"}, {"id": "postgres-1", "deck": "postgres", "title": "Postgres Internals", "source": "card", "q": "Given a composite index on (a, b, c), which queries use it, and why might the planner skip an index?", "a": "It serves a, a+b, a+b+c (leftmost prefix), not b or c alone. The planner skips it when you wrap the column in a function (lower(email), date(ts)), when the query returns too many rows (above roughly 10%, seq scan is cheaper), on stale stats, or a type mismatch.", "ref": "cards/postgres_internals"}, {"id": "postgres-2", "deck": "postgres", "title": "Postgres Internals", "source": "card", "q": "How do you read EXPLAIN ANALYZE, and what's your first check?", "a": "Compare estimated vs actual rows first. A plan with est 50 and actual 48,210 means stale stats: run ANALYZE. Then check scan type, loops times per-loop time, and buffers hit vs read. ANALYZE actually runs the query, so wrap writes in BEGIN...ROLLBACK.", "ref": "cards/postgres_internals"}, {"id": "postgres-3", "deck": "postgres", "title": "Postgres Internals", "source": "card", "q": "Explain MVCC in Postgres and why a long-running transaction causes bloat.", "a": "UPDATE writes a new tuple version and readers never block writers. VACUUM reclaims dead versions no snapshot needs. A long-running or idle-in-transaction session pins the xmin horizon, so VACUUM removes nothing and tables bloat. Set idle_in_transaction_session_timeout; stale replication slots pin it too.", "ref": "cards/postgres_internals"}, {"id": "postgres-4", "deck": "postgres", "title": "Postgres Internals", "source": "card", "q": "What does Read Committed fail to protect against, and what does Repeatable Read still allow?", "a": "Read Committed (default, new snapshot per statement) allows non-repeatable reads, phantoms, lost updates and write skew. Repeatable Read aborts lost updates and is phantom-free in Postgres, but still allows write skew. Serializable (SSI) stops it; RR and Serializable can fail with 40001, so retry the whole transaction.", "ref": "cards/postgres_internals"}, {"id": "postgres-5", "deck": "postgres", "title": "Postgres Internals", "source": "card", "q": "How do you build a job queue on Postgres, and how do you fix write skew?", "a": "SELECT ... FOR UPDATE SKIP LOCKED LIMIT 1 lets workers grab different rows without blocking. FOR UPDATE also fixes lost updates with a row lock. Write skew (both txs read a set, write different rows): use Serializable, or lock the whole set or a guard row.", "ref": "cards/postgres_internals"}, {"id": "postgres-6", "deck": "postgres", "title": "Postgres Internals", "source": "card", "q": "30 pods each with a pool of 10, and max_connections is 200. What happens, and how do you size the pool?", "a": "300 is greater than 200, so you get 'too many clients'. Rule: pods times pool is at most max_connections minus reserved, and put PgBouncer in front. Each connection is an OS process; throughput peaks near 2x cores, then drops, so a bigger pool is slower. Busy conns = QPS x query time.", "ref": "cards/postgres_internals"}, {"id": "postgres-7", "deck": "postgres", "title": "Postgres Internals", "source": "card", "q": "What breaks with PgBouncer in transaction mode?", "a": "Anything session-scoped: SET, advisory locks, LISTEN, temp tables, and prepared statements. Session state leaks to the next client. Use SET LOCAL, PgBouncer 1.21+ max_prepared_statements, or asyncpg statement_cache_size=0.", "ref": "cards/postgres_internals"}, {"id": "dist-sys-1", "deck": "dist-sys", "title": "Distributed Systems Theory", "source": "card", "q": "State CAP correctly and say what PACELC adds.", "a": "'Pick 2 of 3' is the trap: partitions aren't optional, so CAP only says during a partition choose consistency or availability. PACELC adds the normal case: Else, latency or consistency, since replication costs round trips even when healthy.", "ref": "cards/distributed_systems_theory"}, {"id": "dist-sys-2", "deck": "dist-sys", "title": "Distributed Systems Theory", "source": "card", "q": "Where do Postgres, DynamoDB/Cassandra, Spanner and etcd sit on CAP and PACELC?", "a": "Postgres single primary: CP, PC/EC. DynamoDB/Cassandra: AP and tunable, PA/EL by default. Spanner: CP, PC/EC, paying commit-wait latency via TrueTime. etcd/ZooKeeper: CP via Raft/Zab, the minority side refuses requests; they're coordination stores.", "ref": "cards/distributed_systems_theory"}, {"id": "dist-sys-3", "deck": "dist-sys", "title": "Distributed Systems Theory", "source": "card", "q": "Order the consistency models strong to weak, and is serializable the same as linearizable?", "a": "Linearizable (one copy, real-time order), sequential, causal, session (read-your-writes, monotonic), eventual. No: serializable is about transaction isolation, linearizable is about recency of a single object. Strict serializable is both.", "ref": "cards/distributed_systems_theory"}, {"id": "dist-sys-4", "deck": "dist-sys", "title": "Distributed Systems Theory", "source": "card", "q": "Explain R + W > N. What breaks it?", "a": "Read and write sets must share at least one replica. N=3, W=2, R=2 overlaps, so a read sees the latest write and survives one node down. W=1,R=1 is eventual. Sloppy quorums with hinted handoff break the guarantee until handoff completes.", "ref": "cards/distributed_systems_theory"}, {"id": "dist-sys-5", "deck": "dist-sys", "title": "Distributed Systems Theory", "source": "card", "q": "Why does last-write-wins lose data, and what do you use instead?", "a": "The write with the newer wall-clock timestamp wins, so a skewed clock silently drops real writes. Use version vectors to detect concurrency, or CRDTs. Lamport clocks give ordering; vector clocks detect concurrent writes.", "ref": "cards/distributed_systems_theory"}, {"id": "dist-sys-6", "deck": "dist-sys", "title": "Distributed Systems Theory", "source": "card", "q": "How does Raft elect and commit, and how many failures does a 3, 4 or 5 node cluster survive?", "a": "A node with no heartbeat becomes candidate and needs a majority vote in a term; the leader appends to its log and an entry commits once a majority has it. N=3 survives 1, N=4 survives 1, N=5 survives 2, so even N adds cost, not tolerance.", "ref": "cards/distributed_systems_theory"}, {"id": "dist-sys-7", "deck": "dist-sys", "title": "Distributed Systems Theory", "source": "card", "q": "A GC-paused old leader wakes up and still writes. How do you stop it?", "a": "Fencing token: a number that only grows per lease (the Raft term works), and storage rejects any token lower than the highest it has seen. Leases and timeouts alone can't stop a paused process that doesn't know it lost leadership.", "ref": "cards/distributed_systems_theory"}, {"id": "dist-sys-8", "deck": "dist-sys", "title": "Distributed Systems Theory", "source": "card", "q": "Is exactly-once delivery real? How do you get exactly-once effects from Kafka into Postgres?", "a": "Delivery is at-least-once; the effect can be exactly-once through idempotence. Write to Postgres with dedupe on event_id (UNIQUE / ON CONFLICT DO NOTHING) in the same transaction as the effect, THEN commit the offset. Kafka transactions are atomic only inside Kafka.", "ref": "cards/distributed_systems_theory"}, {"id": "k8s-1", "deck": "k8s", "title": "Kubernetes: Request Path, Probes & Resources", "source": "card", "q": "Trace a request from client to pod. Is a Service a process?", "a": "Client, DNS, cloud LB (L4 or L7), ingress controller, Service, EndpointSlice, pod. A Service isn't a process: kube-proxy (iptables/IPVS) rewrites the ClusterIP to a pod IP on every node. Many ingresses skip it and proxy to pod IPs from EndpointSlices, so a Terminating pod can still get hits.", "ref": "cards/k8s_request_path_probes"}, {"id": "k8s-2", "deck": "k8s", "title": "Kubernetes: Request Path, Probes & Resources", "source": "card", "q": "Startup, readiness and liveness: what does each ask and what happens on failure?", "a": "Startup: finished booting? Gates the others, restarts if exhausted. Readiness: can it take traffic now? Pulled from the EndpointSlice, no restart. Liveness: wedged beyond self-repair? The only one that kills (restart). A slow model load killed by liveness needs a startupProbe.", "ref": "cards/k8s_request_path_probes"}, {"id": "k8s-3", "deck": "k8s", "title": "Kubernetes: Request Path, Probes & Resources", "source": "card", "q": "Why must liveness never check dependencies like the database?", "a": "A DB blip would fail liveness on every pod and restart them all, turning a blip into an outage. Keep liveness dumb: is the event loop answering at all? Hard-checking a shared DB in readiness has a similar failure: every pod goes unready.", "ref": "cards/k8s_request_path_probes"}, {"id": "k8s-4", "deck": "k8s", "title": "Kubernetes: Request Path, Probes & Resources", "source": "card", "q": "CPU limit vs memory limit: what happens when each is exceeded?", "a": "CPU over the limit is throttled by CFS quota, slowed but not killed. Memory over the limit is OOMKilled, exit 137. The CPU trap: quota is per 100 ms window, so bursty async or GIL services throttle at low average CPU and p99 spikes. Common stance: CPU request yes, limit loose.", "ref": "cards/k8s_request_path_probes"}, {"id": "k8s-5", "deck": "k8s", "title": "Kubernetes: Request Path, Probes & Resources", "source": "card", "q": "What is the HPA formula, and when does CPU-based HPA fail?", "a": "desired = ceil(current x metric / target), and utilisation is a percent of the pod's request, so no request means no HPA. For an I/O-bound async service CPU stays low while latency climbs; scale on RPS or lag via KEDA. A 20x spike lags minutes, so use KEDA or schedules.", "ref": "cards/k8s_request_path_probes"}, {"id": "k8s-6", "deck": "k8s", "title": "Kubernetes: Request Path, Probes & Resources", "source": "card", "q": "What does a PodDisruptionBudget cover, and how does it block an upgrade?", "a": "It caps voluntary evictions (drain, upgrade), not crashes. minAvailable equal to replicas (or maxUnavailable: 0) blocks every drain and cluster upgrade. Keep one pod of slack.", "ref": "cards/k8s_request_path_probes"}, {"id": "k8s-7", "deck": "k8s", "title": "Kubernetes: Request Path, Probes & Resources", "source": "card", "q": "A pod is not starting or keeps restarting. Give me your debug ladder and what exit 137 and 143 mean.", "a": "get pods -o wide, describe pod (Events at the bottom are the why), logs --previous, get endpointslice for running-but-no-traffic, debug -it for an ephemeral container. 137 is SIGKILL (OOMKill or grace expired); 143 is SIGTERM; 1 or 2 is an app error.", "ref": "cards/k8s_request_path_probes"}, {"id": "observability-1", "deck": "observability", "title": "Observability & SLOs", "source": "card", "q": "Why is averaging p99 across pods wrong, and what do you do instead?", "a": "Percentiles can't be averaged or combined. Use histograms: sum the bucket counts across pods, then compute the quantile, e.g. histogram_quantile(0.99, sum by (le) (rate(x_bucket[5m]))). Summary quantiles are computed client-side and cannot be aggregated. Put bucket edges at your SLO.", "ref": "cards/observability_slos"}, {"id": "observability-2", "deck": "observability", "title": "Observability & SLOs", "source": "card", "q": "Why not use user_id or trace_id as a Prometheus label?", "a": "Cardinality: 1M user_ids means 1M time series per metric and Prometheus OOMs. Metrics need bounded labels; high-cardinality identifiers belong in logs and traces. Attach trace_id as an exemplar on a histogram instead.", "ref": "cards/observability_slos"}, {"id": "observability-3", "deck": "observability", "title": "Observability & SLOs", "source": "card", "q": "How do metrics, logs and traces link together, and what's the glue?", "a": "Metrics say it's broken, traces say where, logs say what happened to that request. Stamp trace_id on every log line (a ContextVar plus logging filter) and attach exemplars to latency histograms. Without links you have three silos.", "ref": "cards/observability_slos"}, {"id": "observability-4", "deck": "observability", "title": "Observability & SLOs", "source": "card", "q": "Head vs tail sampling in OpenTelemetry?", "a": "Head sampling decides at the root: cheap but blind to errors and slow outliers. Tail sampling buffers the whole trace in the collector and keeps all errors, slow traces and about 1% of the rest. It costs RAM and needs all spans of a trace to reach one collector.", "ref": "cards/observability_slos"}, {"id": "observability-5", "deck": "observability", "title": "Observability & SLOs", "source": "card", "q": "RED vs USE: what is each for?", "a": "RED (Rate, Errors, Duration) is per service or endpoint and says what users feel. USE (Utilization, Saturation, Errors) is per resource like CPU, DB pool, queue and says why a box is slow. Saturation (queue depth, pool wait, Kafka lag) warns first.", "ref": "cards/observability_slos"}, {"id": "observability-6", "deck": "observability", "title": "Observability & SLOs", "source": "card", "q": "What does 99.9% availability over 30 days mean in minutes, and what does each extra nine do?", "a": "43,200 minutes x 0.001 = 43.2 minutes of downtime, or about 3M bad requests out of roughly 3B. 99.5% is 216 min; 99.99% is 4.3 min. Each extra nine is 10x less room.", "ref": "cards/observability_slos"}, {"id": "observability-7", "deck": "observability", "title": "Observability & SLOs", "source": "card", "q": "Explain burn-rate alerting. What would you page on?", "a": "Burn = error rate / (1 - SLO). Page at 14.4x over 1h AND 5m (2% of budget in an hour), and 6x over 6h AND 30m; ticket at 1x over 3d. The long window proves it's real, the short window makes the alert clear fast. Page on symptoms, not CPU.", "ref": "cards/observability_slos"}, {"id": "observability-8", "deck": "observability", "title": "Observability & SLOs", "source": "card", "q": "What SLOs would you set for the Jio recommender, and what's the trap?", "a": "SLOs on what users see: valid feed under 200 ms at 95%, availability 99.9% (today's under 0.5% errors), personalized at least 95%, freshness within 15 min at 99%. Trap: don't claim an SLO you never had; say what you measured, then what you'd set. Fallbacks hide outages.", "ref": "cards/observability_slos"}, {"id": "networking-1", "deck": "networking", "title": "Networking & TLS: curl https://", "source": "card", "q": "Walk me through what happens on a cold `curl https://` in round trips.", "a": "DNS (cached or 1-4 hops cold), TCP handshake 1 RTT, TLS 1.3 handshake 1 RTT (1.2 is 2), then the HTTP request 1 RTT. So cold is DNS plus 3 RTT before the first byte; warm pooled connection is about 1 RTT. At 100 ms RTT: 300 ms vs 100 ms.", "ref": "cards/networking_tls"}, {"id": "networking-2", "deck": "networking", "title": "Networking & TLS: curl https://", "source": "card", "q": "What is TLS 0-RTT and what's the catch?", "a": "On resumption TLS 1.3 can send early data with zero extra round trips. The catch: 0-RTT data is replayable, so allow it for idempotent GETs only.", "ref": "cards/networking_tls"}, {"id": "networking-3", "deck": "networking", "title": "Networking & TLS: curl https://", "source": "card", "q": "You lower a DNS TTL before a failover. Do clients switch immediately?", "a": "No. Low TTL does not mean instant failover: resolvers and clients cache longer than the TTL, and caching happens at every hop. Plan for slow convergence and don't rely on DNS alone for failover.", "ref": "cards/networking_tls"}, {"id": "networking-4", "deck": "networking", "title": "Networking & TLS: curl https://", "source": "card", "q": "A TLS cert check fails. What are the common failures and the classic chain bug?", "a": "Hostname not in a SAN entry, expired (the number one outage cause), chain not ending in a trusted root, or revoked (OCSP stapling). Classic bug: the server skips the intermediate, so the browser works but curl or Python fails.", "ref": "cards/networking_tls"}, {"id": "networking-5", "deck": "networking", "title": "Networking & TLS: curl https://", "source": "card", "q": "Where does head-of-line blocking live in HTTP/1.1, HTTP/2 and HTTP/3?", "a": "HTTP/1.1: per connection, queued requests (so about 6 connections per host). HTTP/2: multiplexed streams, but a single TCP loss stalls all streams. HTTP/3 runs QUIC over UDP with independent streams, so the blocking is gone. HOL moved down a layer and QUIC solved it.", "ref": "cards/networking_tls"}, {"id": "networking-6", "deck": "networking", "title": "Networking & TLS: curl https://", "source": "card", "q": "L4 vs L7 load balancer, and what happens with gRPC behind an L4 LB?", "a": "L4 (NLB, IPVS) forwards connections and sees only IPs and ports; L7 (ALB, nginx, Envoy) reads requests and routes by host, path and header. gRPC over HTTP/2 uses one long-lived connection, so behind L4 it pins to one pod. Fix: an L7 proxy or client-side balancing.", "ref": "cards/networking_tls"}, {"id": "networking-7", "deck": "networking", "title": "Networking & TLS: curl https://", "source": "card", "q": "A request is slow. How do you split the timing and find which stage is guilty?", "a": "curl -w with time_namelookup, time_connect, time_appconnect, time_starttransfer, time_total; these are cumulative, so subtract. Then dig +trace for DNS, openssl s_client -servername for certs (omit SNI and you may get the wrong cert), tcpdump for repeated SYN (loss) or RST.", "ref": "cards/networking_tls"}, {"id": "estimation-1", "deck": "estimation", "title": "Estimation & Latency Numbers", "source": "card", "q": "100M requests/day: what is the average RPS, and what's the shortcut and its trap?", "a": "100M / 86,400 is about 1.2k RPS (exactly 1,157). Shortcut: sketch with 10^5 seconds a day, then say 'about 12 per million per day'. Trap: 10^5 is 14% low, so 1M/day is 11.6/s, not 10/s.", "ref": "cards/estimation_latency"}, {"id": "estimation-2", "deck": "estimation", "title": "Estimation & Latency Numbers", "source": "card", "q": "The resume says 33k peak RPS on 100M requests/day. What do you say about the peak/avg ratio?", "a": "33k over 1.16k is about 28x, but normal peak is only 2-3x (about 3.5k). 28x needs a story: a news push burst. How long did it last, was it cached, was it pre-scaled? Don't defend it without that.", "ref": "cards/estimation_latency"}, {"id": "estimation-3", "deck": "estimation", "title": "Estimation & Latency Numbers", "source": "card", "q": "Use Little's Law to size concurrency for 33k RPS at 200 ms p95.", "a": "In flight = arrival rate x time in system = 33k x 0.2 s, about 6.6k (3.3k at p50). An async loop can hold that; sync needs a lot of threads or workers. Trap: slow downstream means W up, L up, and pools exhaust.", "ref": "cards/estimation_latency"}, {"id": "estimation-4", "deck": "estimation", "title": "Estimation & Latency Numbers", "source": "card", "q": "Give me the order-of-magnitude latency numbers I should have in my head.", "a": "RAM about 100 ns; SSD random read 16-100 us; same-DC round trip about 0.5 ms; cross-AZ 1-2 ms; cross-continent 70-150 ms. A network hop is about 5,000x a RAM read. Trap: 100 sequential same-DC calls is 50 ms before real work: batch or fan out.", "ref": "cards/estimation_latency"}, {"id": "estimation-5", "deck": "estimation", "title": "Estimation & Latency Numbers", "source": "card", "q": "Jio ATS: 100k resumes/day at about 200 KB each. Walk me through the storage estimate.", "a": "100k / 86,400 is about 1.2 resumes/s, so ingest rate is tiny. 100k x 200 KB = 20 GB/day, about 7.3 TB/yr of raw files in object storage; parsed text is about 1 GB/day. Vectors: 1536-d float32 is 6 KB each; x10 chunks is about 6 GB/day, and the index wants RAM. State the file-size assumption first.", "ref": "cards/estimation_latency"}, {"id": "estimation-6", "deck": "estimation", "title": "Estimation & Latency Numbers", "source": "card", "q": "How do you size the fleet for 33k peak RPS, and how do you sanity-check it?", "a": "33k / per-pod RPS: at 500 per pod that's 66 pods, about 94 at 70% target utilisation. Average load needs about 3 pods, so a fixed peak fleet idles about 96%: autoscale or cache. Sanity check: 33k feed reads/s is Redis-sized, not Postgres-sized, so the hot path must be cached.", "ref": "cards/estimation_latency"}, {"id": "rag-1", "deck": "rag", "title": "RAG Pipeline & Debugging", "source": "card", "q": "Describe the RAG pipeline end to end and where each stage can fail.", "a": "Offline: ingest (parse + ACL tags), chunk, embed, index. Online: retrieve (BM25 + dense with RRF, top-50), rerank (cross-encoder to top-5), assemble, generate with citations. Every stage needs its own metric. Retrieve wide for recall, rerank narrow for precision.", "ref": "cards/rag_pipeline_debugging"}, {"id": "rag-2", "deck": "rag", "title": "RAG Pipeline & Debugging", "source": "card", "q": "Where do you apply ACL filters in a RAG system, and why?", "a": "Inside the vector query, as a pre-filter. Post-filtering a top-k returns a short or empty result and risks leaking restricted content into the prompt.", "ref": "cards/rag_pipeline_debugging"}, {"id": "rag-3", "deck": "rag", "title": "RAG Pipeline & Debugging", "source": "card", "q": "How do you choose chunk size, and what are the failure modes at each extreme?", "a": "Start around 256-512 tokens with 10-15% overlap, then tune on recall@k. Too big dilutes the vector and wastes tokens; too small loses 'the clause above' context. Fixes: small-to-big, prepend the section path, keep tables whole, chunk by clause.", "ref": "cards/rag_pipeline_debugging"}, {"id": "rag-4", "deck": "rag", "title": "RAG Pipeline & Debugging", "source": "card", "q": "Bi-encoder vs cross-encoder: why do you need both?", "a": "A bi-encoder embeds query and doc separately, so doc vectors are precomputed and ANN search over millions takes milliseconds: recall. A cross-encoder reads query and doc together, one forward pass per pair, so it's accurate but only affordable on top-50: precision. A reranker can't fix a recall miss.", "ref": "cards/rag_pipeline_debugging"}, {"id": "rag-5", "deck": "rag", "title": "RAG Pipeline & Debugging", "source": "card", "q": "Users search exact IDs, clause numbers and acronyms and retrieval misses them. Why, and what's the fix?", "a": "Dense embeddings capture meaning, not exact tokens, while BM25 finds the literal ID. Fix: hybrid retrieval, BM25 plus dense, fused with Reciprocal Rank Fusion. Confirm by checking that BM25 finds it and dense doesn't.", "ref": "cards/rag_pipeline_debugging"}, {"id": "rag-6", "deck": "rag", "title": "RAG Pipeline & Debugging", "source": "card", "q": "The system answers confidently when nothing in the corpus matches. How do you handle it?", "a": "Set a score floor on the top retrieval score; below it, say 'I don't know' instead of generating. Pair it with a cite-or-refuse prompt. Confirm by checking that top scores on unanswerable queries sit below any sensible floor.", "ref": "cards/rag_pipeline_debugging"}, {"id": "llm-eval-1", "deck": "llm-eval", "title": "LLM Evaluation", "source": "card", "q": "Why treat evals as tests, and what makes a good golden set?", "a": "A prompt, model or chunking change is a code change, so every edit reruns the suite in CI and a regression fails the build. Golden set: 50-300 real, stratified, labeled examples including edge and adversarial cases, versioned in git. Start with about 30 from real failures.", "ref": "cards/llm_evaluation"}, {"id": "llm-eval-2", "deck": "llm-eval", "title": "LLM Evaluation", "source": "card", "q": "What is the trap with test examples and the prompt, and how do you split data?", "a": "Copying test examples into the few-shot prompt inflates the score (leakage). Keep a dev set you tune on and a held-out test set you touch rarely. Same rule for fine-tuning data: dedupe it against the test set.", "ref": "cards/llm_evaluation"}, {"id": "llm-eval-3", "deck": "llm-eval", "title": "LLM Evaluation", "source": "card", "q": "What eval method do you reach for first, and when do you use an LLM judge?", "a": "Cheapest check that works: exact or structured match (per-field P/R/F1) first; BLEU/ROUGE are weak for LLMs; embedding similarity is blind to facts ('not X' scores close to 'X'). Use a judge for what code can't check (tone, RAG faithfulness) and calibrate it with humans.", "ref": "cards/llm_evaluation"}, {"id": "llm-eval-4", "deck": "llm-eval", "title": "LLM Evaluation", "source": "card", "q": "What biases does an LLM judge have and how do you fix each?", "a": "Position bias: run both orders and count only agreeing verdicts. Verbosity bias: rubric says don't reward length. Self-preference: judge with a different or stronger model. Fuzzy 1-10 scales: use binary or 3-point rubrics. Always hand-label 50-100 and report agreement (Cohen's kappa about 0.6+).", "ref": "cards/llm_evaluation"}, {"id": "llm-eval-5", "deck": "llm-eval", "title": "LLM Evaluation", "source": "card", "q": "Offline eval says the new prompt is better, but the A/B test says worse. What do you do?", "a": "Online is ground truth. The offline set is stale or the judge is miscalibrated: diff production inputs against the golden set and slice by segment. Fix the offline set, then ship on the corrected numbers. Offline gates deploy; online confirms.", "ref": "cards/llm_evaluation"}, {"id": "llm-eval-6", "deck": "llm-eval", "title": "LLM Evaluation", "source": "card", "q": "Prompt B beats A by 2% on 50 samples. Do you ship it?", "a": "No: at n=50 the 95% CI at an 80% score is about +/-11 pp, and you'd need about a 15 pp gap to call a winner. Score both on the same examples with a paired test (McNemar or bootstrap), report n, CI and per-slice results, and use temperature 0 or average 3-5 runs.", "ref": "cards/llm_evaluation"}, {"id": "llm-eval-7", "deck": "llm-eval", "title": "LLM Evaluation", "source": "card", "q": "How do you close the eval loop from production traces?", "a": "Sample and flag prod traces, read 50-100 failing ones, tag and count failure types, add new test cases to the golden set, fix the most frequent type first (not the most vivid), rerun and compare to baseline. Every fixed bug becomes a permanent test case.", "ref": "cards/llm_evaluation"}, {"id": "miss-R3Q1", "deck": "data-model", "title": "Python Data Model", "source": "miss", "q": "Explain MRO and C3 linearization. Why does it matter for super()?", "a": "MRO is the order Python searches classes for an attribute. C3 builds it so children come before parents and the order in `class X(A, B)` is preserved, which makes super() cooperative in diamonds. Inspect it with X.__mro__.", "ref": "R3 Q1 · misses.md"}, {"id": "miss-R3Q2", "deck": "data-model", "title": "Python Data Model", "source": "miss", "q": "What is a metaclass, and when would you actually use one?", "a": "A metaclass is the class of a class: `type` creates classes, and a custom metaclass hooks class creation (registries, ORMs like SQLAlchemy declarative). Today __init_subclass__ or a decorator covers about 90% of uses.", "ref": "R3 Q2 · misses.md"}, {"id": "miss-R3Q3", "deck": "data-model", "title": "Python Data Model", "source": "miss", "q": "What is the difference between __getattr__, __getattribute__ and descriptors?", "a": "__getattribute__ runs on every lookup; __getattr__ only when normal lookup fails. Descriptors (__get__/__set__ on a class attribute) power property, methods and classmethod. Data descriptors beat the instance __dict__; non-data ones don't.", "ref": "R3 Q3 · misses.md"}, {"id": "miss-R3Q15", "deck": "async", "title": "Async & Concurrency", "source": "miss", "q": "Your async service has p99 spikes and failing health checks. How do you detect a blocked event loop in prod?", "a": "asyncio debug mode (PYTHONASYNCIODEBUG=1) logs slow callbacks over 100 ms. Add a loop-lag metric: schedule a sleep and measure the drift. Use py-spy dump to see the blocking stack. Then fix: to_thread for sync I/O, a process pool for CPU.", "ref": "R3 Q15 · misses.md"}, {"id": "miss-R3Q16", "deck": "async", "title": "Async & Concurrency", "source": "miss", "q": "gather vs TaskGroup vs as_completed: how do they differ and which is your default?", "a": "gather returns results in order; on error the others keep running unless you cancel them. TaskGroup cancels siblings on the first failure and raises an ExceptionGroup. as_completed handles results as they finish. TaskGroup is the default.", "ref": "R3 Q16 · misses.md"}, {"id": "miss-R3Q17", "deck": "async", "title": "Async & Concurrency", "source": "miss", "q": "What is structured concurrency and how does it apply to asyncio?", "a": "A task's lifetime is bounded by the block that created it: no orphan tasks, errors propagate to the parent, and cancellation flows down. TaskGroup or anyio gives you that. Bare create_task doesn't, and needs a stored reference or it can be GC'd.", "ref": "R3 Q17 · misses.md"}, {"id": "miss-R3Q24", "deck": "api", "title": "API Design", "source": "miss", "q": "Design the error model for an API. How do clients know whether to retry, and what is a correlation ID?", "a": "Stable error code, message, details, and a correlation ID, following problem-details (RFC 9457). Retryability is explicit: status class (429/503 retryable, other 4xx not), Retry-After, and a retryable flag. The correlation ID ties the client's report to your logs and traces.", "ref": "R3 Q24 · misses.md"}, {"id": "miss-R3Q26", "deck": "api", "title": "API Design", "source": "miss", "q": "How does a token bucket work, and where do you place rate limiting: edge or in-app?", "a": "Refill at rate r up to capacity b; each request takes a token, so bursts up to b are allowed. Do coarse per-IP limits at the edge or gateway, and per-tenant or business limits in-app, using Redis plus Lua for atomicity.", "ref": "R3 Q26 · misses.md"}, {"id": "miss-R3Q29", "deck": "k8s", "title": "Kubernetes: Request Path, Probes & Resources", "source": "miss", "q": "How do you do graceful shutdown on Kubernetes so deploys don't drop requests?", "a": "Endpoint removal and SIGTERM race in parallel. A preStop sleep lets routing converge, then the app drains in-flight requests. Grace period must exceed preStop plus drain. Demo: PyPractice/pp_k8s/graceful_shutdown/.", "ref": "R3 Q29 · misses.md"}, {"id": "miss-R2Q1", "deck": "memory-gil", "title": "Python Memory, Copies & GIL", "source": "miss", "q": "What is the GIL, and give me concrete cases where it is released.", "a": "One thread runs Python bytecode at a time. It is released during blocking I/O (socket and file reads, time.sleep) and by C extensions that drop it (NumPy, hashlib on big buffers, compression). Threads help I/O-bound work, not pure-Python CPU work.", "ref": "R2 Q1 · misses.md"}, {"id": "miss-R2Q4", "deck": "memory-gil", "title": "Python Memory, Copies & GIL", "source": "miss", "q": "Shallow vs deep copy: what happens to nested objects?", "a": "A shallow copy makes a new outer container but shares the nested objects, so `copy[0].append()` changes the original too. deepcopy recursively copies the nested objects. Don't reverse these.", "ref": "R2 Q4 · misses.md"}, {"id": "miss-R2Q16", "deck": "api", "title": "API Design", "source": "miss", "q": "FastAPI vs Flask: explain WSGI vs ASGI.", "a": "WSGI is synchronous, one request per worker thread. ASGI is an async interface supporting long-lived connections (WebSockets, SSE) and concurrency on one event loop. FastAPI is Starlette (ASGI) plus Pydantic validation plus dependency injection.", "ref": "R2 Q16 · misses.md"}, {"id": "miss-R2Q48", "deck": "redis", "title": "Caching with Redis", "source": "miss", "q": "How do you build a distributed lock in Redis, and is Redlock safe?", "a": "SET key token NX PX ttl, and release only if the token matches (Lua). Redlock takes a majority across N independent Redis nodes but is still unsafe under GC pauses or clock jumps. For correctness use fencing tokens checked by the resource.", "ref": "R2 Q48 · misses.md"}, {"id": "miss-R2Q62", "deck": "docker", "title": "Docker: Image & Runtime", "source": "miss", "q": "How do you slim down a Python Docker image?", "a": "Multi-stage: the build stage has compilers and builds wheels; the runtime stage copies only the wheels or venv onto a slim or distroless base. Order layers deps before code, add .dockerignore, run non-root, use exec-form CMD.", "ref": "R2 Q62 · misses.md"}, {"id": "miss-R2Q116", "deck": "auth", "title": "Auth: Sessions, JWT, OAuth2 & OIDC", "source": "miss", "q": "OAuth2 vs OIDC: what is each, and access token vs ID token?", "a": "OAuth2 is authorization (delegated access): the access token is for the API. OIDC is an authentication layer on top: the ID token (a JWT) tells the client who the user is. Never send ID tokens to APIs.", "ref": "R2 Q116 · misses.md"}, {"id": "miss-R1Q47-50", "deck": "resilience", "title": "Resilience Patterns", "source": "miss", "q": "Tell me about the DataWeave crawler: how did you handle anti-bot measures and alerting?", "a": "Architecture: scheduler to fetchers to parsers to storage. Politeness and rate limits, proxy rotation, block detection, retries with backoff. Alert on success rate and freshness per source. Prepare real numbers from the project.", "ref": "R1 Q47-50 · misses.md"}, {"id": "miss-R5Q22", "deck": "rag", "title": "RAG Pipeline & Debugging", "source": "miss", "q": "A RAG system gives a wrong answer. How do you debug it?", "a": "Bisect: is the right chunk in the corpus? In top-k retrieval (recall)? Did the reranker keep it in the top-5 (ranking)? Then replay generation with the frozen context: does the model still fail? Fix whichever stage broke.", "ref": "R5 Q22 · misses.md"}, {"id": "sd-01-1", "deck": "sd-01", "title": "SD 01 · News feed", "source": "card", "q": "Why is your peak 28× the average?", "a": "Push notifications fire to millions at once. It's scheduled traffic, so you pre-scale on the push calendar and shed load in tiers.", "ref": "R4 Q11–12 · system_design/01_news_feed"}, {"id": "sd-01-2", "deck": "sd-01", "title": "SD 01 · News feed", "source": "card", "q": "How does a brand-new article get recommended with zero clicks?", "a": "The fresh candidate source plus content embeddings computed at ingestion, with an exploration boost for its first N impressions.", "ref": "R4 Q11–12 · system_design/01_news_feed"}, {"id": "sd-01-3", "deck": "sd-01", "title": "SD 01 · News feed", "source": "card", "q": "A new user with no history?", "a": "Region/language trending from the CDN, onboarding topic picks, then streaming features personalize within a few clicks.", "ref": "R4 Q11–12 · system_design/01_news_feed"}, {"id": "sd-01-4", "deck": "sd-01", "title": "SD 01 · News feed", "source": "card", "q": "How do you A/B test a ranker?", "a": "Hash users into buckets; log `feed_request_id` and the model version with every impression; compare CTR and dwell with guardrails on latency and diversity.", "ref": "R4 Q11–12 · system_design/01_news_feed"}, {"id": "sd-01-5", "deck": "sd-01", "title": "SD 01 · News feed", "source": "card", "q": "The ML team ships a model twice a day. How do you deploy it safely?", "a": "Registry → shadow scoring → 5% canary with automatic guardrails → ramp. Rollback is a version-pointer switch.", "ref": "R4 Q11–12 · system_design/01_news_feed"}, {"id": "sd-01-6", "deck": "sd-01", "title": "SD 01 · News feed", "source": "card", "q": "What's cached, and what's your hit ratio?", "a": "The CDN trending feed; ranked lists for pagination (page 2+ ≈ 100%); features in Redis. The personalized first page is computed, not cached.", "ref": "R4 Q11–12 · system_design/01_news_feed"}, {"id": "sd-01-7", "deck": "sd-01", "title": "SD 01 · News feed", "source": "card", "q": "Why not precompute every user's feed nightly?", "a": "It's stale for breaking news, wasted on users who don't return, and it's 100M × 20 writes a night.", "ref": "R4 Q11–12 · system_design/01_news_feed"}, {"id": "sd-01-8", "deck": "sd-01", "title": "SD 01 · News feed", "source": "card", "q": "What happens when Redis is down?", "a": "Default features plus trending: the feed degrades rather than failing, which protects the 0.5% error budget.", "ref": "R4 Q11–12 · system_design/01_news_feed"}];
const DAY = 864e5;
const INTERVAL_DAYS = [0, 1, 3, 7, 14, 30]; // Leitner box -> days until next review
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmt = s => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>");
const today = () => new Date().toLocaleDateString("en-CA");

const decks = [];
for (const c of DECK) if (!decks.some(d => d.id === c.deck)) decks.push({ id: c.deck, title: c.title });

let reviews = {};            // card id -> {box, due, hits, misses, last}
let db = null;
let size = 20, picked = new Set(), round = null;

/* ---------- storage: artifact db when available, else this browser ---------- */
const writeChains = {};
function persist(path, body) {
  if (db) {
    const prev = writeChains[path] || Promise.resolve();
    writeChains[path] = prev.then(() => db.doc(path).set(body)).catch(e => {
      $("sync").textContent = "Couldn't save the last grade (" + (e && e.code || "error") + "). It is kept in this browser only.";
      $("sync").className = "note warn";
      saveLocal();
    });
  } else saveLocal();
}
function saveLocal() { try { localStorage.setItem("drill.reviews", JSON.stringify(reviews)); } catch (_) {} }
function loadLocal() { try { return JSON.parse(localStorage.getItem("drill.reviews") || "{}"); } catch (_) { return {}; } }

async function connect() {
  reviews = loadLocal();
  renderAll();
  try { db = window.claude ? await window.claude.use("db") : null; } catch (_) { db = null; }
  if (!db) { $("sync").textContent = "Progress is saved in this browser only."; return; }
  $("sync").textContent = "Loading your progress…";
  const timer = setTimeout(() => { $("sync").textContent = "Can't reach saved progress yet. Grades still count and will sync."; $("sync").className = "note warn"; }, 10000);
  db.collection("reviews").onSnapshot(snap => {
    if (!snap.metadata.fromCache) { clearTimeout(timer); $("sync").textContent = "Progress syncs across your devices."; $("sync").className = "note"; }
    const next = {};
    for (const d of snap.docs) next[d.id] = d.data();
    reviews = Object.assign(loadLocalOnlyIfEmpty(snap), next);
    renderStats(); renderGrid(); renderFilterLine();
    if (!round) renderIdle();
  }, e => { clearTimeout(timer); db = null; $("sync").textContent = "Saved progress is unavailable (" + e.code + "). Using this browser."; $("sync").className = "note warn"; });
}
function loadLocalOnlyIfEmpty(snap) { return snap.empty ? loadLocal() : {}; }

/* ---------- scheduling ---------- */
const isDue = (r, now) => r && r.due <= now;
function pool() {
  const onlyMiss = $("only-miss").checked;
  return DECK.filter(c => (!picked.size || picked.has(c.deck)) && (!onlyMiss || c.source === "miss"));
}
function buildRound() {
  const now = Date.now(), cards = pool();
  const due = cards.filter(c => isDue(reviews[c.id], now)).sort((a, b) => reviews[a.id].due - reviews[b.id].due);
  const fresh = cards.filter(c => !reviews[c.id]).sort((a, b) => (a.source === "miss" ? 0 : 1) - (b.source === "miss" ? 0 : 1));
  return due.concat(fresh).slice(0, size);
}
function grade(card, g) {
  const now = Date.now();
  const r = Object.assign({ box: 0, due: now, hits: 0, misses: 0 }, reviews[card.id]);
  if (g === "miss") { r.box = 1; r.due = now; r.misses++; }
  else if (g === "shaky") { r.box = Math.max(1, r.box); r.due = now + DAY; }
  else { r.box = Math.min(5, r.box + 1); r.due = now + INTERVAL_DAYS[r.box] * DAY; r.hits++; }
  r.last = now; r.lastGrade = g; r.deck = card.deck;
  reviews[card.id] = r;
  persist("reviews/" + card.id, r);
  round.tally[g]++;
  if (g === "miss" && round.requeued[card.id] !== true) {   // see it once more this round
    round.requeued[card.id] = true;
    round.queue.splice(Math.min(round.i + 4, round.queue.length), 0, card);
  }
  const day = today();
  const s = round.sessionDoc;
  s.date = day; s.seen++; s[g]++; if (!s.decks.includes(card.deck)) s.decks.push(card.deck);
  if (g !== "got" && !s.weak.includes(card.id)) s.weak.push(card.id);
  persist("sessions/" + day, s);
  round.i++; round.revealed = false;
  renderStats(); renderGrid(); renderCard();
}

/* ---------- rendering ---------- */
function renderStats() {
  const now = Date.now();
  $("s-due").textContent = DECK.filter(c => isDue(reviews[c.id], now)).length;
  $("s-new").textContent = DECK.filter(c => !reviews[c.id]).length;
  $("s-mast").textContent = DECK.filter(c => (reviews[c.id] || {}).box >= 4).length;
}
function renderGrid() {
  const now = Date.now();
  $("grid").innerHTML = decks.map(d => {
    const cs = DECK.filter(c => c.deck === d.id), n = cs.length;
    const seen = cs.filter(c => reviews[c.id]).length, mast = cs.filter(c => (reviews[c.id] || {}).box >= 4).length;
    const due = cs.filter(c => isDue(reviews[c.id], now)).length;
    return `<button type="button" class="deck" data-deck="${esc(d.id)}" aria-pressed="${picked.has(d.id)}">
      <span class="name">${esc(d.title)}</span>
      <span class="bar"><i class="m" style="width:${100 * mast / n}%"></i><i class="s" style="width:${100 * (seen - mast) / n}%"></i></span>
      <span class="nums">${n} cards · ${seen} seen · ${due} due</span></button>`;
  }).join("");
}
function renderFilterLine() {
  const n = pool().length, r = buildRound().length;
  const what = picked.size ? [...picked].map(id => decks.find(d => d.id === id).title).join(", ") : "all decks";
  $("filterline").innerHTML = `Round from ${esc(what)}: ${r} ready of ${n}.` + (picked.size ? ` <button type="button" id="clear">Clear filter</button>` : "");
}
function renderIdle() {
  const next = buildRound().length;
  $("stage").innerHTML = next
    ? `<p class="q">${next} cards are ready.</p><p class="hint">Due reviews come first, then cards you've never seen, with your real interview misses at the front. Say the answer out loud before you flip: reading it silently doesn't count.</p><div class="actions"><button type="button" class="btn primary" data-act="start">Start round <kbd>Enter</kbd></button></div>`
    : `<p class="q">Nothing is due in this selection.</p><p class="hint">Pick other decks below, or come back tomorrow. Spacing is what makes it stick.</p>`;
}
function renderCard() {
  const c = round.queue[round.i];
  if (!c) return renderDone();
  const r = reviews[c.id];
  $("stage").innerHTML = `
    <div class="meta"><span class="pill${c.source === "miss" ? " miss" : ""}">${c.source === "miss" ? "interview miss" : esc(c.title)}</span>
      ${r ? `<span class="pill box">box ${r.box}</span>` : ""}<span class="progress">${round.i + 1} / ${round.queue.length}</span></div>
    <p class="q">${fmt(c.q)}</p>
    ${round.revealed
      ? `<p class="a">${fmt(c.a)}</p><p class="ref">${esc(c.ref || "")}</p>
         <div class="actions">
           <button type="button" class="btn miss" data-g="miss">Missed it <kbd>1</kbd></button>
           <button type="button" class="btn shaky" data-g="shaky">Shaky <kbd>2</kbd></button>
           <button type="button" class="btn got" data-g="got">Got it <kbd>3</kbd></button></div>`
      : `<p class="hint">Say your answer out loud, about 30 seconds, as you would to an interviewer.</p>
         <div class="actions"><button type="button" class="btn primary" data-act="reveal">Show answer <kbd>Space</kbd></button></div>`}`;
  // Focus the reveal button, but never a grade button: a second Space must not grade the card.
  const target = round.revealed ? $("stage") : $("stage").querySelector(".btn");
  if (target) target.focus({ preventScroll: true });
}
function renderDone() {
  const t = round.tally; round = null;
  $("stage").innerHTML = `<div class="done"><h2>Round done</h2></div>
    <div class="tally"><span><b style="color:var(--good)">${t.got}</b>got it</span><span><b style="color:var(--warn)">${t.shaky}</b>shaky</span><span><b style="color:var(--bad)">${t.miss}</b>missed</span></div>
    <p class="hint">Missed cards come back next round; shaky ones tomorrow. Ask Claude Code to "read my drill results" and it will update your misses list.</p>
    <div class="actions"><button type="button" class="btn primary" data-act="start">Another round <kbd>Enter</kbd></button></div>`;
  renderFilterLine();
}
function renderAll() { renderStats(); renderGrid(); renderFilterLine(); renderIdle(); }

function start() {
  const q = buildRound();
  if (!q.length) return renderIdle();
  const day = today();
  round = { queue: q, i: 0, revealed: false, requeued: {}, tally: { got: 0, shaky: 0, miss: 0 },
            sessionDoc: { date: day, seen: 0, got: 0, shaky: 0, miss: 0, decks: [], weak: [] } };
  // Add today's earlier rounds to this one; grades made before the read lands are kept.
  if (db) db.doc("sessions/" + day).get().then(s => {
    if (!s.exists || !round) return;
    const prev = s.data(), cur = round.sessionDoc;
    for (const k of ["seen", "got", "shaky", "miss"]) cur[k] += prev[k] || 0;
    for (const k of ["decks", "weak"]) for (const v of prev[k] || []) if (!cur[k].includes(v)) cur[k].push(v);
  }).catch(() => {});
  renderCard();
}

/* ---------- events ---------- */
document.addEventListener("click", e => {
  const t = e.target.closest("button"); if (!t) return;
  if (t.dataset.size) { size = +t.dataset.size; document.querySelectorAll("[data-size]").forEach(b => b.setAttribute("aria-pressed", b === t)); renderFilterLine(); if (!round) renderIdle(); }
  else if (t.dataset.deck) { picked.has(t.dataset.deck) ? picked.delete(t.dataset.deck) : picked.add(t.dataset.deck); renderGrid(); renderFilterLine(); if (!round) renderIdle(); }
  else if (t.id === "clear") { picked.clear(); renderGrid(); renderFilterLine(); if (!round) renderIdle(); }
  else if (t.id === "start" || t.dataset.act === "start") start();
  else if (t.dataset.act === "reveal") { round.revealed = true; renderCard(); }
  else if (t.dataset.g && round) grade(round.queue[round.i], t.dataset.g);
});
$("only-miss").addEventListener("change", () => { renderFilterLine(); if (!round) renderIdle(); });
document.addEventListener("keydown", e => {
  if (e.target.matches("input") || e.metaKey || e.ctrlKey || e.altKey) return;
  if (!round) { if (e.key === "Enter" && !e.target.closest("button")) { e.preventDefault(); start(); } return; }
  if (e.key === " " || e.key === "Enter") { e.preventDefault(); if (!round.revealed) { round.revealed = true; renderCard(); } }
  else if (round.revealed && ["1", "2", "3"].includes(e.key)) grade(round.queue[round.i], ["miss", "shaky", "got"][+e.key - 1]);
});

connect();
</script>
