<title>News Feed Design Kit</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: navy header band; full-width architecture diagram with a detail panel under it; reference sections below. Palette shared with the repo's cheat-sheet cards. */
:root {
  --bg: #f4f6fb; --surface: #ffffff; --line: #d8deea; --ink: #1b2540; --muted: #5b6578; --grid: #e9edf5;
  --navy: #1b2540; --navy-ink: #e6ebf7; --navy-sub: #b9c4dc;
  --read: #2457d6; --read-soft: #e7eeff; --async: #138a43; --async-soft: #e3f4ea; --ingest: #b45309; --ingest-soft: #fdf0e1;
  --bad: #c62828; --bad-soft: #fde8e8; --edge: #9aa5bb;
  --display: "IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif;
  --body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", Consolas, ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1424; --surface: #18203a; --line: #2a3556; --ink: #e6ebf7; --muted: #9aa5bb; --grid: #1d2643;
  --navy: #0a0e1b; --navy-ink: #e6ebf7; --navy-sub: #9aa5bb;
  --read: #7aa2ff; --read-soft: #1f2c52; --async: #4cc27e; --async-soft: #15301f; --ingest: #f0a24a; --ingest-soft: #3a2a14;
  --bad: #ff7a7a; --bad-soft: #3d1a1d; --edge: #5d6a89; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0f1424; --surface: #18203a; --line: #2a3556; --ink: #e6ebf7; --muted: #9aa5bb; --grid: #1d2643;
  --navy: #0a0e1b; --navy-ink: #e6ebf7; --navy-sub: #9aa5bb;
  --read: #7aa2ff; --read-soft: #1f2c52; --async: #4cc27e; --async-soft: #15301f; --ingest: #f0a24a; --ingest-soft: #3a2a14;
  --bad: #ff7a7a; --bad-soft: #3d1a1d; --edge: #5d6a89; color-scheme: dark }
* { box-sizing: border-box }
body { background: var(--bg); color: var(--ink); font: 15px/1.6 var(--body); }
.wrap { max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.band { background: var(--navy); color: var(--navy-ink); }
header .wrap { padding-block: 24px 20px; display: grid; gap: 6px; }
.eyebrow { font: 600 12px var(--mono); letter-spacing: .8px; text-transform: uppercase; color: var(--navy-sub); }
h1 { font: 700 34px/1.1 var(--display); margin: 0; text-wrap: balance; }
.sub { color: var(--navy-sub); margin: 0; font-size: 14.5px; }
nav.toc { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 8px; font-size: 13px; }
nav.toc a { color: var(--navy-ink); opacity: .85; text-decoration: none; border-bottom: 1px solid transparent; }
nav.toc a:hover { border-bottom-color: currentColor; }
main .wrap { padding-block: 22px 56px; display: grid; gap: 26px; }
section > h2 { font: 700 22px var(--display); margin: 0 0 10px; letter-spacing: .2px; text-wrap: balance; }
.panel { background: var(--surface); border: 1.5px solid var(--line); border-radius: 14px; padding: 18px 20px; min-width: 0; }
p { margin: 0 0 10px; max-width: 75ch; }
code { font: 13.5px var(--mono); background: var(--read-soft); padding: 1px 5px; border-radius: 4px; }
strong { font-weight: 600; }

/* attempt callout */
.attempt { border: 2px dashed var(--read); background: var(--read-soft); }
.attempt .prompt { font: 500 18px/1.5 var(--body); margin-bottom: 12px; }
.attempt ul { margin: 6px 0 10px; padding-left: 20px; }
.attempt .timer { font: 600 13px var(--mono); color: var(--read); }

/* diagram */
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
.chip { font: 600 13px var(--body); border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 999px; padding: 6px 13px; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.chip:focus-visible, .node:focus-visible rect, .btn:focus-visible, summary:focus-visible { outline: 3px solid var(--read); outline-offset: 2px; }
.legend { display: flex; gap: 14px; margin-left: auto; font-size: 12.5px; color: var(--muted); flex-wrap: wrap; }
.legend i { display: inline-block; width: 11px; height: 11px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
.scroller { overflow-x: auto; border-radius: 10px; background: var(--bg); border: 1px solid var(--line); }
svg.diagram { display: block; min-width: 760px; width: 100%; height: auto; }
.lane-label { font: 600 12px var(--mono); letter-spacing: .6px; text-transform: uppercase; }
.edge { fill: none; stroke: var(--edge); stroke-width: 1.6; transition: opacity .15s, stroke .15s; }
.edge.dashed { stroke-dasharray: 5 4; }
.node { cursor: pointer; transition: opacity .15s; }
.node rect { stroke-width: 1.6; }
.node .t1 { font: 600 13.5px var(--body); fill: var(--ink); }
.node .t2 { font: 11px var(--mono); fill: var(--muted); }
.read rect { fill: var(--read-soft); stroke: var(--read); }
.async rect { fill: var(--async-soft); stroke: var(--async); }
.ingest rect { fill: var(--ingest-soft); stroke: var(--ingest); }
.node.sel rect { stroke-width: 3.2; }
svg.dim .node:not(.on) { opacity: .22; }
svg.dim .edge:not(.on) { opacity: .12; }
svg .edge.on { stroke: var(--ink); stroke-width: 2.6; }
svg .node.on rect { stroke-width: 3; }

.detail { margin-top: 14px; display: grid; gap: 10px; }
.detail h3 { font: 700 20px var(--display); margin: 0; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.detail .tech { font: 13px var(--mono); color: var(--muted); }
.kv { display: grid; grid-template-columns: 130px 1fr; gap: 6px 16px; }
.kv dt { font: 600 12px var(--mono); letter-spacing: .5px; text-transform: uppercase; color: var(--muted); padding-top: 3px; }
.kv dd { margin: 0; }
.kv dd.bad { color: var(--bad); }
.hint { color: var(--muted); font-size: 14px; margin: 0; }
.stepper { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.btn { font: 600 14px var(--body); border-radius: 9px; padding: 8px 14px; cursor: pointer; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); }
.btn.primary { background: var(--read); border-color: var(--read); color: #fff; }
.btn:disabled { opacity: .4; cursor: default; }
.stepnum { font: 600 13px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.steptext { font-size: 16.5px; line-height: 1.55; margin: 0; max-width: 80ch; }
.budget { display: flex; height: 22px; border-radius: 6px; overflow: hidden; background: var(--grid); }
.budget span { display: flex; align-items: center; justify-content: center; font: 600 11px var(--mono); color: #fff; background: var(--read); border-right: 1px solid var(--surface); opacity: .35; white-space: nowrap; overflow: hidden; }
.budget span.done { opacity: .7 } .budget span.cur { opacity: 1 }
.budget-cap { font: 12px var(--mono); color: var(--muted); }

/* reference sections */
.tbl { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th { text-align: left; font: 600 11.5px var(--mono); letter-spacing: .5px; text-transform: uppercase; color: var(--muted); padding: 6px 10px; border-bottom: 1.5px solid var(--line); }
td { padding: 8px 10px; border-bottom: 1px solid var(--grid); vertical-align: top; }
td:first-child { font-weight: 600; }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
.cols h3 { font: 700 17px var(--display); margin: 0 0 8px; }
ul.plain { margin: 0; padding-left: 20px; } ul.plain li { margin-bottom: 6px; max-width: 75ch; }
details.qa { border-bottom: 1px solid var(--grid); padding: 10px 2px; }
details.qa summary { cursor: pointer; font-weight: 600; list-style: none; display: flex; gap: 10px; }
details.qa summary::before { content: "＋"; color: var(--read); font-weight: 700; }
details.qa[open] summary::before { content: "－"; }
details.qa p { margin: 8px 0 0 26px; color: var(--ink); }
.anchor li { margin-bottom: 8px; }
footer { color: var(--muted); font-size: 12.5px; text-align: center; padding-block: 0 30px; }
@media (max-width: 640px) { h1 { font-size: 27px } .kv { grid-template-columns: 1fr; } .kv dt { padding-top: 6px } .legend { margin-left: 0 } }
@media (prefers-reduced-motion: reduce) { .edge, .node { transition: none } }
</style>

<script>
const KIT = {"page_title": "News Feed Design Kit", "eyebrow": "System design kit 01 · R4 Q11–12 · anchor: Jio News", "title": "News feed at 100M requests a day", "subtitle": "Personalized ranking at 33k peak RPS with p95 under 200 ms: retrieve for recall, rank for precision, degrade instead of failing.", "footer": "interview repo · system_design/01_news_feed · source of truth: design.md · rebuild with scripts/tools/build_kit.py", "attempt": {"prompt": "Design the backend that serves a personalized news feed for a news app: 100 million feed requests a day. Each request returns a ranked list of articles for that user. Walk me through it.", "clarify": ["How many users, logged in vs anonymous? (drives cold start and feature storage)", "Latency target, measured where? How fresh must breaking news be?", "Does the ML team own the model, or do I? Serving only, or training too?", "Traffic shape: flat, or spikes from push notifications and big events?"]}, "lanes": [{"id": "ingest", "label": "Article ingestion", "rows": [0, 0]}, {"id": "read", "label": "Request path", "rows": [1, 4]}, {"id": "async", "label": "Feedback loop", "rows": [5, 6]}], "components": [{"id": "publisher", "name": "Publishers / CMS", "short": "Publishers", "tech": "CMS, feeds", "lane": "ingest", "col": 1, "row": 0, "what": "Where articles come from: partner feeds and the editorial CMS.", "why": "The corpus has to enter somewhere; ingestion needs one entry point it can validate.", "without": "No articles, no feed.", "knob": "Webhook or poll frequency per source."}, {"id": "ingestion", "name": "Ingestion pipeline", "short": "Ingestion", "tech": "dedupe, embed", "lane": "ingest", "col": 2, "row": 0, "what": "Validates the article, clusters near-duplicates (5 outlets, same event), classifies language and category, and computes the embedding.", "why": "An article must be embedded and clustered before it can be retrieved or de-duplicated.", "without": "No corpus to retrieve from, and the same story shows up five times.", "knob": "Workers and embedding batch size. Target under 60 s end to end for breaking news."}, {"id": "articles", "name": "Article store", "short": "Article store", "tech": "Postgres / MongoDB", "lane": "ingest", "col": 6, "row": 0, "what": "Article metadata: title, source, language, category, publish time, image, embedding version.", "why": "The final ranked ids must be hydrated into something a phone can render.", "without": "You return ids with no titles.", "knob": "Cache hot rows (about 500k active articles); batch reads of 20–50 ids. At 10× load, the metadata cache is what protects the database."}, {"id": "client", "name": "Mobile client", "short": "Mobile app", "tech": "batches events", "lane": "read", "col": 0, "row": 2, "what": "Renders the feed, batches impression and click events (every ~30 s or 50 events), and keeps the last feed for offline.", "why": "Client batching turns 2B impressions a day into a stream the backend can absorb.", "without": "One HTTP call per impression melts the event collector at a push spike.", "knob": "Batch size and flush interval; persist unsent batches on the device."}, {"id": "cdn", "name": "CDN / edge", "short": "CDN", "tech": "trending, images", "lane": "read", "col": 1, "row": 1, "what": "Serves images and the non-personalized trending feed per region and language.", "why": "The cold-start and fallback feed is identical for millions of users, so it's perfectly cacheable.", "without": "Every anonymous user and every degraded request hits the feed service.", "knob": "TTL: 30–60 s for trending."}, {"id": "gateway", "name": "API gateway / LB", "short": "Gateway", "tech": "auth, rate limit", "lane": "read", "col": 1, "row": 2, "what": "TLS termination, auth, per-user rate limits, routing to the feed service.", "why": "One choke point for auth and abuse.", "without": "Every service re-implements auth and rate limiting.", "knob": "Replicas; rate-limit thresholds."}, {"id": "feed", "name": "Feed service", "short": "Feed service", "tech": "FastAPI on GKE", "lane": "read", "col": 2, "row": 2, "what": "The orchestrator: fans out to candidate sources in parallel, filters, calls the ranker, re-ranks, caches the ranked list, responds.", "why": "One place owns the latency budget and the fallbacks.", "without": "The client would orchestrate, and every backend failure becomes user-visible.", "knob": "Stateless pods (async I/O, ~1–2k RPS each) plus scheduled pre-scaling before pushes."}, {"id": "experiment", "name": "Experiment service", "short": "Experiments", "tech": "hash(user) % 100", "lane": "read", "col": 1, "row": 3, "what": "Assigns each user to a bucket that picks the ranker version and the re-rank rule weights.", "why": "Every ranking change ships behind an experiment.", "without": "You can't prove a new model is better, only argue about it.", "knob": "Traffic split per experiment; guardrail metrics (latency, diversity)."}, {"id": "ann", "name": "Personal candidates (ANN)", "short": "Personal ANN", "tech": "in-memory index", "lane": "read", "col": 3, "row": 1, "what": "Takes the user's vector and returns the ~300 nearest articles from an in-memory index (FAISS / ScaNN class).", "why": "This is the personalization. 500k × 256-dim embeddings ≈ 0.5 GB, so the index fits in RAM on every replica.", "without": "Everyone gets the trending feed.", "knob": "k; replicas; incremental index updates as articles arrive."}, {"id": "trending", "name": "Trending candidates", "short": "Trending", "tech": "Redis sorted sets", "lane": "read", "col": 3, "row": 2, "what": "Top ~100 articles by decayed click velocity for the user's region and language. Counters are updated by the stream processor.", "why": "Freshness and cold start; also the fallback feed.", "without": "New users see nothing relevant, and degradation has nothing to fall back to.", "knob": "Decay half-life; N per region/language."}, {"id": "topics", "name": "Followed topics / sources", "short": "Topics", "tech": "follows → recent", "lane": "read", "col": 3, "row": 3, "what": "About 100 recent articles from the categories and sources the user follows.", "why": "Explicit interest is the strongest signal, and it's cheap.", "without": "Follows feel ignored.", "knob": "Items per topic; recency window."}, {"id": "fresh", "name": "Fresh / breaking", "short": "Fresh", "tech": "last N minutes", "lane": "read", "col": 3, "row": 4, "what": "About 50 articles published in the last few minutes, matched to the user's language and region.", "why": "New articles have no clicks, and history-based retrieval finds them late. This source fixes new-article cold start.", "without": "Breaking news reaches feeds only after it's no longer breaking.", "knob": "Window length; exploration boost for the first N impressions."}, {"id": "filter", "name": "Filter", "short": "Filter", "tech": "seen, dupes, lang", "lane": "read", "col": 4, "row": 2, "what": "Unions ~500 candidates and removes seen articles (Redis set or Bloom filter per user), wrong language, blocked sources, and near-duplicate clusters.", "why": "Repeats are the number-one complaint in feeds.", "without": "The same story five times, and stories you read yesterday.", "knob": "Seen-set TTL (~3 days); Bloom filter size (~1–2 KB per user)."}, {"id": "ranker", "name": "Ranker (model server)", "short": "Ranker", "tech": "GBDT / small MLP", "lane": "read", "col": 5, "row": 2, "what": "Scores ~500 candidates per request in one batch with a light model.", "why": "Candidate generation is about recall; ranking is about precision.", "without": "You rank by one heuristic, and CTR suffers.", "knob": "Replicas, batch size, model size. CPU inference must not hit the GIL: use ONNX / a C-backed runtime or process workers."}, {"id": "features", "name": "Online feature store", "short": "Feature store", "tech": "Redis cluster", "lane": "read", "col": 5, "row": 4, "what": "User vector, recent clicks and categories, article CTR, fetched in one batched MGET for all candidates.", "why": "Ranking needs fresh features (what you clicked two minutes ago). About 100 GB of user features, so it's a cluster.", "without": "Ranking on yesterday's features; or 500 single GETs at ~0.5 ms each blow the whole budget.", "knob": "Shards; pipeline/batch size. At 10× load, its connections and throughput break first."}, {"id": "rerank", "name": "Re-rank + respond", "short": "Re-rank", "tech": "diversity · rules", "lane": "read", "col": 6, "row": 2, "what": "Applies diversity (max 3 per category in the top 10), freshness boost, sponsored and editorial slots; hydrates metadata; caches the full ranked list for 10 min under feed_request_id; returns page 1.", "why": "The model optimizes clicks; the product needs variety. The cached list makes pagination stable.", "without": "A clickbait monoculture, and page 2 reshuffles or repeats page 1.", "knob": "Rule weights (A/B tested); ranked-list cache TTL."}, {"id": "collector", "name": "Event collector", "short": "Event collector", "tech": "POST /v1/events", "lane": "async", "col": 0, "row": 5, "what": "Accepts batched impression, click and dwell events (gzip) and returns 202.", "why": "Keeps analytics writes off the request path.", "without": "Warehouse writes add latency to every feed load.", "knob": "Stateless replicas; dedupe impressions on (feed_request_id, article_id)."}, {"id": "pubsub", "name": "Event bus", "short": "Pub/Sub · Kafka", "tech": "impressions, clicks", "lane": "async", "col": 1, "row": 5, "what": "Durable topics for events; the durable record before the data lake.", "why": "Decouples producers from the stream and batch consumers; allows replay.", "without": "Each consumer is wired to the collector, and a slow consumer backs everything up.", "knob": "Partitions; retention. Alert on consumer lag."}, {"id": "stream", "name": "Stream processor", "short": "Stream processor", "tech": "seconds-fresh", "lane": "async", "col": 2, "row": 5, "what": "Updates trending counters, seen sets, recent-interest features and article CTR in Redis within seconds.", "why": "Closes the loop fast: you click on cricket, and your next feed has more cricket.", "without": "Features update only daily, and the seen set lags (repeats).", "knob": "Consumer parallelism; lag alerts."}, {"id": "lake", "name": "Data lake", "short": "Data lake", "tech": "BigQuery / GCS", "lane": "async", "col": 1, "row": 6, "what": "Every event, partitioned by day.", "why": "Training data, A/B analysis, replay.", "without": "You can never train or prove anything.", "knob": "Partitioning; retention tiers."}, {"id": "training", "name": "Offline training", "short": "Training jobs", "tech": "daily", "lane": "async", "col": 3, "row": 6, "what": "Retrains the ranker, recomputes user embeddings, rebuilds the ANN index.", "why": "Heavy learning belongs offline.", "without": "The model goes stale as interests and news shift.", "knob": "Schedule (daily, or twice a day per R4 Q12); compute."}, {"id": "registry", "name": "Model registry + deploy", "short": "Model registry", "tech": "shadow → canary", "lane": "async", "col": 6, "row": 5, "what": "Versioned models. A new version runs in shadow (scored, not served), then a 5% canary with CTR and latency guardrails, then ramps; rollback is a version-pointer switch.", "why": "Twice-a-day model releases need a safe path (R4 Q12).", "without": "Every model push is a gamble on live traffic.", "knob": "Canary percentage, guardrail thresholds, ramp speed."}], "edges": [{"from": "publisher", "to": "ingestion"}, {"from": "ingestion", "to": "articles"}, {"from": "ingestion", "to": "ann"}, {"from": "ingestion", "to": "fresh"}, {"from": "client", "to": "gateway"}, {"from": "client", "to": "cdn", "dashed": true}, {"from": "gateway", "to": "feed"}, {"from": "feed", "to": "experiment"}, {"from": "feed", "to": "ann"}, {"from": "feed", "to": "trending"}, {"from": "feed", "to": "topics"}, {"from": "feed", "to": "fresh"}, {"from": "ann", "to": "filter"}, {"from": "trending", "to": "filter"}, {"from": "topics", "to": "filter"}, {"from": "fresh", "to": "filter"}, {"from": "filter", "to": "ranker"}, {"from": "features", "to": "ranker"}, {"from": "ranker", "to": "rerank"}, {"from": "articles", "to": "rerank"}, {"from": "client", "to": "collector"}, {"from": "collector", "to": "pubsub"}, {"from": "pubsub", "to": "stream"}, {"from": "pubsub", "to": "lake"}, {"from": "stream", "to": "features"}, {"from": "lake", "to": "training"}, {"from": "training", "to": "registry"}, {"from": "registry", "to": "ranker", "dashed": true}], "flows": [{"id": "A", "name": "Read path", "budget": "p95 target 200 ms; the rest is network and queueing headroom", "summary": "`GET /v1/feed`: about 110 ms of server work, inside a 200 ms p95.", "steps": [{"nodes": ["client", "gateway"], "edges": [["client", "gateway"]], "ms": 5, "text": "The client calls `GET /v1/feed`. The gateway terminates TLS, authenticates, and applies the per-user rate limit. If the backend is shedding load, the client gets the **CDN trending feed** instead."}, {"nodes": ["gateway", "feed", "experiment"], "edges": [["gateway", "feed"], ["feed", "experiment"]], "ms": 5, "text": "The feed service looks up the user's experiment bucket (which ranker, which rule weights). For page 2+, it returns the **cached ranked list** for the cursor and stops here."}, {"nodes": ["feed", "ann", "trending", "topics", "fresh"], "edges": [["feed", "ann"], ["feed", "trending"], ["feed", "topics"], ["feed", "fresh"]], "ms": 35, "text": "Fan out to the four candidate sources **in parallel**, each with a 40 ms timeout passed down from the request deadline. A source that misses its timeout is dropped: personalization is best effort."}, {"nodes": ["ann", "trending", "topics", "fresh", "filter"], "edges": [["ann", "filter"], ["trending", "filter"], ["topics", "filter"], ["fresh", "filter"]], "ms": 3, "text": "Union about 500 candidates; drop seen, wrong-language, blocked and near-duplicate articles."}, {"nodes": ["features", "ranker"], "edges": [["features", " t"], ["In flight at peak", "33k × 0.2 s (Little's law)", "≈ 6.6k concurrent requests"], ["Bandwidth", "33k × ~5 KB", "≈ 165 MB/s ≈ 1.3 Gbps"], ["Article embeddings", "500k × 256 × 4 B", "≈ 0.5 GB, **fits in RAM**"], ["User features", "~100M × ~1 KB", "≈ 100 GB → Redis cluster"], ["Impressions", "100M × 20", "2B/day ≈ 23k/s avg → **batch on the client**"]]}, {"type": "text", "body": ["The two numbers that shape the design: the **28× spikes** (autoscaling alone is too slow, so pre-scale and shed load) and the **0.5 GB of embeddings** (retrieval can be in memory)."]}]}, {"id": "api", "title": "API and data model", "blocks": [{"type": "table", "head": ["Endpoint", "Notes"], "rows": [["`GET /v1/feed?cursor=&limit=20`", "Cursor encodes `{feed_request_id, offset}`; page 2+ reads the cached ranked list, so scrolling never reshuffles"], ["`POST /v1/events`", "Batched, gzip, returns 202; every event carries `feed_request_id` so clicks join back to the exact ranking"], ["`POST /internal/articles`", "Publisher/CMS into the ingestion pipeline"]]}, {"type": "table", "head": ["Store", "Holds", "Why this store"], "rows": [["Article store", "metadata for ~500k active articles", "small, relational enough; cache in front"], ["ANN index", "article embeddings, active window", "0.5 GB fits in RAM; no network hop"], ["Redis feature store", "user vectors, recent clicks, article CTR", "sub-ms batched reads at 40k RPS"], ["Redis seen set / Bloom", "ids shown in the last ~3 days", "1–2 KB per user; a rare false 'seen' is fine"], ["Redis sorted sets", "trending by region/language", "real-time, cheap, doubles as the fallback"], ["Event bus → data lake", "every impression and click", "training, A/B analysis, replay"]]}]}, {"id": "deep-dives", "title": "Deep dives", "blocks": [{"type": "deep", "title": "1 · Holding p95 at 200 ms at 33k RPS", "items": ["Budget it explicitly (flow A) and propagate the deadline: pass the remaining budget to every call (`asyncio.timeout_at`).", "Parallel fan-out with per-source timeouts; drop a slow source rather than wait. Hedge only idempotent, cheap calls.", "Batch everything: one MGET for ~500 feature keys, one ranker call for ~500 candidates.", "Python: async I/O for fan-out; CPU work in a C-backed runtime or process pool. Warm connection pools: pool exhaustion shows up as a **latency cliff**, not as errors.", "The 28× spike: pushes are scheduled, so **pre-scale on the push calendar**, then shed in tiers: drop personal ANN first, then serve the CDN trending feed. Never return a 5xx when a generic feed would do."]}, {"type": "deep", "title": "2 · Precompute vs online, and caching", "items": ["Fully precomputed feeds: fast, but stale for breaking news, wasted on users who don't return, 100M × 20 writes a night.", "Fully online: fresh, but costly and hard to hold at p95.", "**Hybrid (chosen):** precompute the slow parts (embeddings, ANN index, trending counters), do the cheap parts online (in-memory retrieval, ranking ~500 candidates).", "Cache layers: CDN trending feed · ranked list per `feed_request_id` (page 2+ ≈ 100% hits) · features in Redis · ANN in process memory.", "News is **pull-and-rank on read**, unlike a social feed's fan-out-on-write: there's no follower graph to push into, and relevance changes by the minute."]}]}, {"id": "failures", "title": "Failure modes", "blocks": [{"type": "table", "head": ["Failure", "Effect", "Degrade to"], "rows": [["Ranker down or slow", "can't score", "candidate-source scores (similarity, trending); alert"], ["ANN index unavailable", "no personal candidates", "trending + topics + fresh: less personal, not broken"], ["Redis feature store down", "no features", "default features, or the trending feed"], ["Event bus consumer lag", "stale trending; seen set lags (repeats)", "alert on lag; autoscale consumers"], ["Push-notification spike", "28× load in seconds", "pre-scale on schedule; tiered shedding; CDN fallback"], ["Bad model deployed", "CTR drops", "shadow + canary guardrails; rollback = pointer switch"]]}, {"type": "list", "items": ["**Where data can be lost:** client event batches (app killed before flush), so persist them on the device and retry. Impressions are at-least-once, deduped on `(feed_request_id, article_id)`.", "**SPOF you accept:** a single region for the read path, behind the CDN fallback. Active-active isn't worth it for a feed with a static fallback.", "**10× tomorrow:** Redis connections/throughput break first, then ranker CPU, then Postgres if metadata caching misses."]}]}, {"id": "tradeoffs", "title": "Trade-offs and v1", "blocks": [{"type": "cols", "cols": [{"type": "list", "title": "Chosen against", "items": ["Two-stage over one big model: you can't score 500k articles in 40 ms.", "Hybrid over fully precomputed: freshness wins in news.", "In-memory ANN over a remote vector DB: 0.5 GB fits in RAM. Revisit at 20× corpus.", "Redis over Bigtable/Cassandra for online features: latency first; the lake is the source of truth.", "Eventual over strong consistency: a click influencing the next feed after 10 s is fine.", "Light ranker over a deep model: holds CPU at 40k RPS; GPU serving can come later."]}, {"type": "list", "title": "v1 in 6 weeks (2 engineers)", "items": ["Trending + topic candidates; personal ranking from category affinities (no ANN yet).", "Redis for counters and seen sets; the CDN fallback feed.", "Event logging to the lake with `feed_request_id` **from day one**.", "Later: ANN retrieval, ML ranker, shadow/canary deploys, experiments, duplicate clustering, streaming features."]}]}]}, {"id": "followups", "title": "Interviewer follow-ups", "blocks": [{"type": "qa", "note": "Answer out loud first, then open each one.", "items": [["Why is your peak 28× the average?", "Push notifications fire to millions at once. It's scheduled traffic, so you pre-scale on the push calendar and shed load in tiers."], ["How does a brand-new article get recommended with zero clicks?", "The fresh candidate source plus content embeddings computed at ingestion, with an exploration boost for its first N impressions."], ["A new user with no history?", "Region/language trending from the CDN, onboarding topic picks, then streaming features personalize within a few clicks."], ["How do you A/B test a ranker?", "Hash users into buckets; log `feed_request_id` and the model version with every impression; compare CTR and dwell with guardrails on latency and diversity."], ["The ML team ships a model twice a day. How do you deploy it safely?", "Registry → shadow scoring → 5% canary with automatic guardrails → ramp. Rollback is a version-pointer switch."], ["What's cached, and what's your hit ratio?", "The CDN trending feed; ranked lists for pagination (page 2+ ≈ 100%); features in Redis. The personalized first page is computed, not cached."], ["Why not precompute every user's feed nightly?", "It's stale for breaking news, wasted on users who don't return, and it's 100M × 20 writes a night."], ["What happens when Redis is down?", "Default features plus trending: the feed degrades rather than failing, which protects the 0.5% error budget."]]}]}, {"id": "anchor", "title": "Your anchor: Jio News", "blocks": [{"type": "text", "body": ["Answer these with your **real** numbers before any interview that touches the recommender. If you don't know one, estimate it now and say \"approximately\"."]}, {"type": "list", "items": ["Your resume says GCP, GKE, FastAPI, Redis, PostgreSQL, MongoDB and **Pub/Sub**; on 6 Oct you described **Kafka**. Which was it, and where?", "What drove the 28× peak: pushes, match days, elections? How long did spikes last? Pre-scaled, or HPA only?", "Where was p95 200 ms measured: load balancer, service, or device?", "What was cached, and what was the hit ratio?", "You split embedding and similarity into separate services. Why, and what was the call pattern?", "The GIL and Postgres pooling bottlenecks: what exactly happened, what did you change, and what were the before/after numbers?", "\"Single-han const CW = 180, CH = 100, BW = 146, BH = 56, PAD = 36;
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmt = s => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
const byId = Object.fromEntries(KIT.components.map(c => [c.id, c]));
const laneName = Object.fromEntries(KIT.lanes.map(l => [l.id, l.label]));
let mode = null, step = 0, selected = null;

/* ---------- header ---------- */
$("eyebrow").textContent = KIT.eyebrow;
$("title").textContent = KIT.title;
$("subtitle").textContent = KIT.subtitle;
$("foot").textContent = KIT.footer;
const tocItems = [["attempt", "Your attempt"], ["diagram-sec", "Architecture"]].concat(KIT.sections.map(s => [s.id, s.title]));
$("toc").innerHTML = tocItems.map(([id, t]) => `<a href="#${id}">${esc(t)}</a>`).join("");

/* ---------- attempt ---------- */
$("attempt").innerHTML = `<h2>Your attempt</h2><p class="prompt">${fmt(KIT.attempt.prompt)}</p>
  <p><strong>Ask these first:</strong></p><ul>${KIT.attempt.clarify.map(q => `<li>${fmt(q)}</li>`).join("")}</ul>
  <p class="timer">Design it for 45 minutes before you open anything below. Then grade yourself against the diagram.</p>`;

/* ---------- diagram ---------- */
function box(id) { const c = byId[id]; const x = PAD + c.col * CW, y = PAD + c.row * CH; return { x, y, cx: x + BW / 2, cy: y + BH / 2 }; }
function edgePath(a, b) {
  // Different columns: leave and enter through the sides, so the curve bends inside the gap between columns.
  // Same column: top/bottom. Lay out kit.json so a long edge's straight run crosses only empty cells.
  const A = box(a), B = box(b), dx = B.cx - A.cx, dy = B.cy - A.cy;
  if (byId[a].col !== byId[b].col) {
    const sx = dx > 0 ? A.x + BW : A.x, tx = dx > 0 ? B.x : B.x + BW, c = (tx - sx) / 2;
    return `M${sx},${A.cy} C${sx + c},${A.cy} ${tx - c},${B.cy} ${tx},${B.cy}`;
  }
  const sy = dy > 0 ? A.y + BH : A.y, ty = dy > 0 ? B.y : B.y + BH, c = (ty - sy) / 2;
  return `M${A.cx},${sy} C${A.cx},${sy + c} ${B.cx},${ty - c} ${B.cx},${ty}`;
}
const edgeKey = (a, b) => a + ">" + b;
function drawDiagram() {
  const maxC = Math.max(...KIT.components.map(c => c.col)), maxR = Math.max(...KIT.components.map(c => c.row));
  const W = PAD * 2 + maxC * CW + BW, H = PAD * 2 + maxR * CH + BH + 10;
  const svg = $("svg");
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  const bands = KIT.lanes.map(l => {
    const y0 = PAD + l.rows[0] * CH - 28, y1 = PAD + l.rows[1] * CH + BH + 12;
    return `<rect x="6" y="${y0}" width="${W - 12}" height="${y1 - y0}" rx="10" fill="var(--${l.id}-soft)" opacity=".45"/>
            <text class="lane-label" x="${W - 16}" y="${y0 + 17}" text-anchor="end" fill="var(--${l.id})">${esc(l.label)}</text>`;
  }).join("");
  const edges = KIT.edges.map(e => `<path class="edge${e.dashed ? " dashed" : ""}" data-k="${edgeKey(e.from, e.to)}" d="${edgePath(e.from, e.to)}" marker-end="url(#arrow)"/>`).join("");
  const nodes = KIT.components.map(c => {
    const { x, y } = box(c.id);
    return `<g class="node ${c.lane}" data-id="${c.id}" tabindex="0" role="button" aria-label="${esc(c.name)}">
      <rect x="${x}" y="${y}" width="${BW}" height="${BH}" rx="10"/>
      <text class="t1" x="${x + BW / 2}" y="${y + (c.tech ? 24 : 33)}" text-anchor="middle">${esc(c.short || c.name)}</text>
      ${c.tech ? `<text class="t2" x="${x + BW / 2}" y="${y + 42}" text-anchor="middle">${esc(c.tech)}</text>` : ""}</g>`;
  }).join("");
  svg.innerHTML = `<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--edge)"/></marker></defs>${bands}${edges}${nodes}`;
}

/* ---------- toolbar + detail ---------- */
function drawToolbar() {
  const chips = [`<button type="button" class="chip" data-mode="" aria-pressed="${!mode}">Explore</button>`]
    .concat(KIT.flows.map(f => `<button type="button" class="chip" data-mode="${f.id}" aria-pressed="${mode === f.id}">${esc(f.id)} · ${esc(f.name)}</button>`));
  const legend = `<div class="legend">${KIT.lanes.map(l => `<span><i style="background:var(--${l.id})"></i>${esc(l.label)}</span>`).join("")}</div>`;
  $("toolbar").innerHTML = chips.join("") + legend;
}
function highlight(nodes, edges) {
  const svg = $("svg");
  svg.classList.toggle("dim", !!nodes);
  svg.querySelectorAll(".node").forEach(n => { n.classList.toggle("on", !!nodes && nodes.includes(n.dataset.id)); n.classList.toggle("sel", n.dataset.id === selected); });
  svg.querySelectorAll(".edge").forEach(p => p.classList.toggle("on", !!edges && edges.includes(p.dataset.k)));
}
function stepsUsing(id) {
  const out = [];
  KIT.flows.forEach(f => f.steps.forEach((s, i) => { if (s.nodes.includes(id)) out.push(`${f.id}${i + 1}`); }));
  return out;
}
function renderDetail() {
  const d = $("detail");
  if (mode) {
    const f = KIT.flows.find(x => x.id === mode), s = f.steps[step];
    const edges = (s.edges || []).map(([a, b]) => edgeKey(a, b));
    highlight(s.nodes, edges);
    const total = f.steps.reduce((t, x) => t + (x.ms || 0), 0);
    const bar = total ? `<div class="budget" aria-hidden="true">${f.steps.map((x, i) => x.ms ? `<span style="flex:${x.ms}" class="${i < step ? "done" : i === step ? "cur" : ""}">${x.ms}</span>` : "").join("")}</div>
      <span class="budget-cap">${f.steps.slice(0, step + 1).reduce((t, x) => t + (x.ms || 0), 0)} of ~${total} ms used · ${esc(f.budget || "")}</span>` : "";
    d.innerHTML = `<h3>${esc(f.id)} · ${esc(f.name)}</h3><p class="hint">${fmt(f.summary)}</p>
      <div class="stepper"><button type="button" class="btn" data-step="-1" ${step === 0 ? "disabled" : ""}>← Back</button>
        <span class="stepnum">Step ${step + 1} / ${f.steps.length}</span>
        <button type="button" class="btn primary" data-step="1" ${step === f.steps.length - 1 ? "disabled" : ""}>Next →</button></div>
      <p class="steptext">${fmt(s.text)}</p>${bar}`;
    return;
  }
  if (!selected) {
    highlight(null, null);
    d.innerHTML = `<h3>Tap any box</h3><p class="hint">Each component shows what it is, why it's there, what breaks without it, and the knob you turn to scale it. Pick a flow above to step through a request end to end. Arrow keys step through flows.</p>`;
    return;
  }
  const c = byId[selected];
  const related = KIT.edges.filter(e => e.from === c.id || e.to === c.id);
  highlight([c.id, ...related.map(e => e.from === c.id ? e.to : e.from)], related.map(e => edgeKey(e.from, e.to)));
  const used = stepsUsing(c.id);
  d.innerHTML = `<h3>${esc(c.name)} <span class="tech">${esc(c.tech || "")}</span></h3>
    <dl class="kv"><dt>What</dt><dd>${fmt(c.what)}</dd><dt>Why</dt><dd>${fmt(c.why)}</dd>
    <dt>Without it</dt><dd class="bad">${fmt(c.without)}</dd><dt>Scaling knob</dt><dd>${fmt(c.knob)}</dd>
    <dt>Lane</dt><dd>${esc(laneName[c.lane])}${used.length ? ` · in flow steps ${used.join(", ")}` : ""}</dd></dl>`;
}

/* ---------- reference sections ---------- */
function renderBlock(b) {
  if (b.type === "text") return b.body.map(p => `<p>${fmt(p)}</p>`).join("");
  if (b.type === "list") return `${b.title ? `<h3>${esc(b.title)}</h3>` : ""}<ul class="plain">${b.items.map(i => `<li>${fmt(i)}</li>`).join("")}</ul>`;
  if (b.type === "table") return `<div class="tbl"><table><thead><tr>${b.head.map(h => `<th>${esc(h)}</th>`).join("")}</tr></thead><tbody>${b.rows.map(r => `<tr>${r.map(c => `<td>${fmt(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
  if (b.type === "qa") return `${b.note ? `<p class="hint">${fmt(b.note)}</p>` : ""}${b.items.map(([q, a]) => `<details class="qa"><summary>${fmt(q)}</summary><p>${fmt(a)}</p></details>`).join("")}`;
  if (b.type === "cols") return `<div class="cols">${b.cols.map(c => `<div>${renderBlock(c)}</div>`).join("")}</div>`;
  if (b.type === "deep") return `<h3>${esc(b.title)}</h3>${renderBlock({ type: "list", items: b.items })}`;
  return "";
}
$("sections").innerHTML = KIT.sections.map(s => `<section id="${s.id}"><h2>${esc(s.title)}</h2><div class="panel">${s.blocks.map(renderBlock).join("")}</div></section>`).join("");

/* ---------- events ---------- */
function setMode(m) { mode = m || null; step = 0; selected = null; drawToolbar(); renderDetail(); }
document.addEventListener("click", e => {
  const chip = e.target.closest("[data-mode]");
  if (chip) return setMode(chip.dataset.mode);
  const st = e.target.closest("[data-step]");
  if (st && mode) { const f = KIT.flows.find(x => x.id === mode); step = Math.max(0, Math.min(f.steps.length - 1, step + +st.dataset.step)); return renderDetail(); }
  const n = e.target.closest(".node");
  if (n) { if (mode) { mode = null; drawToolbar(); } selected = selected === n.dataset.id ? null : n.dataset.id; renderDetail(); }
});
document.addEventListener("keydown", e => {
  const n = e.target.closest && e.target.closest(".node");
  if (n && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); n.dispatchEvent(new MouseEvent("click", { bubbles: true })); return; }
  if (e.key === "Escape") return setMode(null);
  if (mode && (e.key === "ArrowRight" || e.key === "ArrowLeft") && !e.target.matches("input,textarea")) {
    const f = KIT.flows.find(x => x.id === mode);
    step = Math.max(0, Math.min(f.steps.length - 1, step + (e.key === "ArrowRight" ? 1 : -1))); renderDetail();
  }
});

drawDiagram(); drawToolbar(); renderDetail();
</script>
